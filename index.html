<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>OVJ Studio - Galería en Vivo</title>
        <style>
            /* ===== RESET ===== */
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            /* ===== BASE ===== */
            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                background: #0a0a0a;
                color: #fff;
                min-height: 100vh;
                padding: 12px 16px 20px;
            }

            /* ===== HEADER CON CO-BRANDING ===== */
            .header {
                padding: 12px 0 8px;
                border-bottom: 1px solid rgba(255, 215, 0, 0.08);
                margin-bottom: 10px;
                position: relative;
            }
            .header::after {
                content: '';
                position: absolute;
                bottom: -1px;
                left: 25%;
                width: 50%;
                height: 1px;
                background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.15), transparent);
            }

            .header-top {
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
                gap: 6px;
            }

            .header-left .ovj-studio {
                font-size: 1.4rem;
                font-weight: 300;
                letter-spacing: 1px;
                user-select: none;
                -webkit-user-select: none;
                -moz-user-select: none;
                cursor: default;
                position: relative;
            }
            .header-left .ovj-studio span {
                font-weight: 700;
                background: linear-gradient(135deg, #f9d976, #f39c12);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }
            .header-left .ovj-studio::before {
                content: '✦';
                position: absolute;
                left: -18px;
                top: 50%;
                transform: translateY(-50%);
                color: rgba(243, 156, 18, 0.3);
                font-size: 0.6rem;
            }

            .header-right .badge-en-vivo {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                background: rgba(231, 76, 60, 0.12);
                color: #e74c3c;
                font-size: 0.6rem;
                font-weight: 700;
                letter-spacing: 1.5px;
                padding: 4px 14px 4px 10px;
                border-radius: 50px;
                text-transform: uppercase;
                border: 1px solid rgba(231, 76, 60, 0.15);
                user-select: none;
                -webkit-user-select: none;
                backdrop-filter: blur(4px);
            }
            .header-right .badge-en-vivo .punto {
                display: inline-block;
                width: 6px;
                height: 6px;
                background: #e74c3c;
                border-radius: 50%;
                animation: pulse 1.8s infinite;
                box-shadow: 0 0 10px rgba(231, 76, 60, 0.3);
            }
            @keyframes pulse {
                0% { opacity: 0.3; transform: scale(0.8); }
                50% { opacity: 1; transform: scale(1.2); }
                100% { opacity: 0.3; transform: scale(0.8); }
            }

            .header-bottom {
                text-align: center;
                padding-top: 4px;
            }
            .header-bottom .evento-titulo {
                font-size: 2.0rem;
                font-weight: 700;
                letter-spacing: 3px;
                color: #fff;
                text-shadow: 0 0 80px rgba(255, 255, 255, 0.04);
                background: linear-gradient(135deg, #fff, #ccc);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                line-height: 1.2;
                position: relative;
                display: inline-block;
            }
            .header-bottom .evento-titulo::after {
                content: '';
                position: absolute;
                bottom: -4px;
                left: 20%;
                width: 60%;
                height: 1px;
                background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.1), transparent);
            }

            @media (max-width: 600px) {
                .header-left .ovj-studio {
                    font-size: 1.1rem;
                }
                .header-left .ovj-studio::before {
                    display: none;
                }
                .header-right .badge-en-vivo {
                    font-size: 0.5rem;
                    padding: 3px 10px 3px 6px;
                }
                .header-bottom .evento-titulo {
                    font-size: 1.5rem;
                    letter-spacing: 1px;
                }
            }

            /* ===== ID DEL FOTÓGRAFO ===== */
            .fotografo-id {
                text-align: center;
                font-size: 0.65rem;
                color: #444;
                letter-spacing: 1px;
                padding-bottom: 6px;
                font-weight: 300;
                user-select: none;
                -webkit-user-select: none;
            }
            .fotografo-id span {
                color: #666;
                background: rgba(255, 255, 255, 0.04);
                padding: 2px 14px;
                border-radius: 20px;
            }
            .fotografo-id strong {
                color: #f39c12;
                font-weight: 600;
            }

            /* ===== ESTADO MINI ===== */
            #estado {
                text-align: center;
                padding: 4px 0 12px;
                font-size: 0.7rem;
                letter-spacing: 0.5px;
                color: #444;
                font-weight: 300;
                user-select: none;
                -webkit-user-select: none;
            }
            #estado .num {
                color: #888;
                font-weight: 600;
            }
            .ok .num {
                color: #2ecc71;
            }
            .error {
                color: #e74c3c;
            }
            .cargando {
                color: #f1c40f;
            }

            /* ===== GALERÍA ===== */
            .galeria {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 14px;
                max-width: 1200px;
                margin: 0 auto;
            }

            /* ===== TARJETA ===== */
            .foto {
                background: #111;
                border-radius: 14px;
                overflow: hidden;
                border: 1px solid #1a1a1a;
                cursor: pointer;
                transition:
                    transform 0.3s ease,
                    box-shadow 0.3s ease;
                position: relative;
                aspect-ratio: 1 / 1;
            }
            .foto:hover {
                transform: translateY(-6px) scale(1.01);
                box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6);
                border-color: rgba(255, 215, 0, 0.15);
            }
            .foto img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
                transition: filter 0.4s ease;
                background: #0a0a0a;
            }
            .foto:hover img {
                filter: brightness(1.06);
            }
            .foto::after {
                content: '↗';
                position: absolute;
                bottom: 12px;
                right: 14px;
                color: rgba(255, 255, 255, 0.08);
                font-size: 1.2rem;
                transition: all 0.3s ease;
            }
            .foto:hover::after {
                color: rgba(255, 215, 0, 0.2);
                transform: translate(-4px, -4px);
            }

            /* ===== BOTÓN "VER MÁS FOTOS" ===== */
            .ver-mas-wrapper {
                grid-column: 1 / -1;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 12px;
                padding: 20px 0 10px;
            }
            .btn-ver-mas {
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid rgba(255, 215, 0, 0.2);
                color: #f39c12;
                padding: 14px 38px;
                border-radius: 50px;
                font-size: 0.9rem;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s ease;
                letter-spacing: 0.5px;
                backdrop-filter: blur(4px);
            }
            .btn-ver-mas:hover {
                background: rgba(243, 156, 18, 0.1);
                border-color: rgba(255, 215, 0, 0.4);
                transform: scale(1.03);
                box-shadow: 0 8px 35px rgba(243, 156, 18, 0.15);
            }
            .btn-ver-mas:active {
                transform: scale(0.97);
            }
            .info-restantes {
                font-size: 0.7rem;
                color: #555;
                font-weight: 300;
                letter-spacing: 0.5px;
                user-select: none;
                -webkit-user-select: none;
            }
            .info-restantes strong {
                color: #f39c12;
                font-weight: 600;
            }

            /* ===== AVISO DE FOTOS NUEVAS ===== */
            .aviso-nuevas {
                grid-column: 1 / -1;
                text-align: center;
                padding: 10px 16px;
                background: rgba(46, 204, 113, 0.08);
                border: 1px solid rgba(46, 204, 113, 0.2);
                border-radius: 50px;
                color: #2ecc71;
                font-size: 0.75rem;
                font-weight: 600;
                letter-spacing: 0.5px;
                animation: pulseNuevas 2s infinite;
                margin: 0 auto;
                max-width: 340px;
                width: 100%;
            }
            @keyframes pulseNuevas {
                0%, 100% { opacity: 0.85; }
                50% { opacity: 1; }
            }

            /* ===== MODAL ===== */
            .modal {
                display: none;
                position: fixed;
                z-index: 999;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                justify-content: center;
                align-items: center;
                padding: 20px;
            }
            .modal.activo {
                display: flex;
            }

            .modal-fondo {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.92);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                z-index: 998;
                display: none;
                animation: blurIn 0.4s ease;
            }
            .modal-fondo.activo {
                display: block;
            }
            @keyframes blurIn {
                from { backdrop-filter: blur(0px); opacity: 0; }
                to { backdrop-filter: blur(12px); opacity: 1; }
            }

            .modal-contenido {
                max-width: 850px;
                width: 100%;
                background: transparent;
                border-radius: 18px;
                position: relative;
                z-index: 999;
                animation: zoomIn 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            }
            @keyframes zoomIn {
                0% { transform: scale(0.85); opacity: 0; }
                100% { transform: scale(1); opacity: 1; }
            }

            .modal-contenido .imagen-wrapper {
                position: relative;
                border-radius: 16px;
                overflow: hidden;
                background: #0a0a0a;
                border: 1px solid rgba(255, 255, 255, 0.06);
                box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
            }

            .modal-contenido .imagen-wrapper::before {
                content: '';
                position: absolute;
                top: -50%;
                left: -50%;
                width: 200%;
                height: 200%;
                background: linear-gradient(
                    45deg,
                    transparent 30%,
                    rgba(255, 255, 255, 0.02) 45%,
                    rgba(255, 255, 255, 0.12) 50%,
                    rgba(255, 255, 255, 0.02) 55%,
                    transparent 70%
                );
                transform: rotate(45deg) translateX(-100%);
                animation: brillo 1.4s ease forwards;
                z-index: 2;
                pointer-events: none;
            }
            @keyframes brillo {
                0% { transform: rotate(45deg) translateX(-100%); }
                100% { transform: rotate(45deg) translateX(100%); }
            }

            .modal-contenido img {
                width: 100%;
                max-height: 68vh;
                object-fit: contain;
                display: block;
                background: #0a0a0a;
                padding: 16px;
                transition: transform 0.3s ease;
            }

            .nav-flecha {
                position: absolute;
                top: 50%;
                transform: translateY(-50%);
                background: rgba(0, 0, 0, 0.7);
                backdrop-filter: blur(8px);
                border: 2px solid rgba(255, 255, 255, 0.12);
                color: #fff;
                width: 50px;
                height: 50px;
                border-radius: 50%;
                cursor: pointer;
                font-size: 1.5rem;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all 0.3s ease;
                z-index: 3;
                user-select: none;
                -webkit-user-select: none;
                box-shadow: 0 4px 25px rgba(0, 0, 0, 0.4);
            }
            .nav-flecha:hover {
                background: rgba(255, 255, 255, 0.15);
                border-color: rgba(255, 215, 0, 0.25);
                transform: translateY(-50%) scale(1.08);
                box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
            }
            .nav-flecha:active {
                transform: translateY(-50%) scale(0.95);
            }
            .nav-flecha.izquierda {
                left: 18px;
            }
            .nav-flecha.derecha {
                right: 18px;
            }
            .nav-flecha.oculto {
                opacity: 0;
                pointer-events: none;
            }

            .modal-footer {
                padding: 16px 20px 20px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 10px;
                background: rgba(0, 0, 0, 0.5);
                backdrop-filter: blur(4px);
                border-radius: 0 0 16px 16px;
                border-top: 1px solid rgba(255, 255, 255, 0.04);
                margin-top: -1px;
            }
            .modal-footer .mensaje-una-sola {
                font-size: 0.7rem;
                color: #555;
                font-weight: 300;
                text-align: center;
                padding-top: 6px;
                width: 100%;
                letter-spacing: 0.3px;
                user-select: none;
                -webkit-user-select: none;
            }
            .modal-footer .mensaje-una-sola strong {
                color: #f1c40f;
                font-weight: 600;
            }

            .btn-pedir {
                background: linear-gradient(135deg, #2ecc71, #27ae60);
                color: #0a0a0a;
                border: none;
                padding: 14px 38px;
                border-radius: 50px;
                font-size: 1rem;
                font-weight: 700;
                cursor: pointer;
                transition: all 0.3s ease;
                display: inline-flex;
                align-items: center;
                gap: 10px;
                width: 100%;
                justify-content: center;
                max-width: 340px;
                letter-spacing: 0.3px;
                user-select: none;
                -webkit-user-select: none;
                box-shadow: 0 4px 25px rgba(46, 204, 113, 0.15);
            }
            .btn-pedir:hover {
                transform: scale(1.03);
                box-shadow: 0 8px 35px rgba(46, 204, 113, 0.25);
                background: linear-gradient(135deg, #27ae60, #1e8449);
            }
            .btn-pedir:active {
                transform: scale(0.97);
            }
            .btn-pedir .icono-whatsapp {
                font-size: 1.3rem;
            }

            .btn-cerrar-modal {
                position: absolute;
                top: 10px;
                right: 14px;
                background: rgba(0, 0, 0, 0.6);
                backdrop-filter: blur(4px);
                border: 1px solid rgba(255, 255, 255, 0.06);
                color: #aaa;
                font-size: 1.4rem;
                cursor: pointer;
                width: 42px;
                height: 42px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all 0.3s ease;
                z-index: 10;
                user-select: none;
                -webkit-user-select: none;
            }
            .btn-cerrar-modal:hover {
                background: rgba(255, 255, 255, 0.1);
                color: #fff;
                border-color: rgba(255, 255, 255, 0.12);
            }

            .footer {
                text-align: center;
                padding: 24px 10px 6px;
                color: #1a1a1a;
                font-size: 0.6rem;
                letter-spacing: 1px;
                border-top: 1px solid #111;
                margin-top: 24px;
                user-select: none;
                -webkit-user-select: none;
                position: relative;
            }
            .footer::before {
                content: '✦';
                display: block;
                color: rgba(255, 215, 0, 0.05);
                font-size: 0.8rem;
                margin-bottom: 4px;
            }

            @media (max-width: 600px) {
                body {
                    padding: 8px 10px 16px;
                }
                .galeria {
                    grid-template-columns: repeat(
                        auto-fill,
                        minmax(150px, 1fr)
                    );
                    gap: 10px;
                }
                .modal {
                    padding: 8px;
                }
                .modal-contenido img {
                    max-height: 48vh;
                    padding: 10px;
                }
                .modal-footer {
                    padding: 12px 14px 16px;
                }
                .btn-pedir {
                    font-size: 0.9rem;
                    padding: 11px 16px;
                    max-width: 100%;
                }
                .nav-flecha {
                    width: 38px;
                    height: 38px;
                    font-size: 1.1rem;
                }
                .nav-flecha.izquierda {
                    left: 6px;
                }
                .nav-flecha.derecha {
                    right: 6px;
                }
                #estado {
                    font-size: 0.6rem;
                    padding: 2px 0 8px;
                }
                .header-bottom .evento-titulo::after {
                    width: 40%;
                    left: 30%;
                }
                .foto::after {
                    display: none;
                }
                .btn-ver-mas {
                    font-size: 0.8rem;
                    padding: 12px 28px;
                }
            }
            @media (max-width: 400px) {
                .galeria {
                    grid-template-columns: 1fr 1fr;
                    gap: 8px;
                }
            }

            html {
                scroll-behavior: smooth;
            }
            ::selection {
                background: #f39c12;
                color: #0a0a0a;
            }
        </style>
    </head>
    <body>
        <!-- ===== HEADER CON CO-BRANDING ===== -->
        <div class="header">
            <div class="header-top">
                <div class="header-left">
                    <h1 class="ovj-studio">OVJ <span>Studio</span></h1>
                </div>
                <div class="header-right">
                    <div class="badge-en-vivo"><span class="punto"></span> En vivo</div>
                </div>
            </div>
            <div class="header-bottom">
                <h2 class="evento-titulo" id="eventoTitulo">Galería en Vivo</h2>
            </div>
        </div>

        <!-- ===== ID DEL FOTÓGRAFO ===== -->
        <div class="fotografo-id" id="fotografoIdDisplay">
            <span
                >📸 Galería:
                <strong id="fotografoNombre">Cargando...</strong></span
            >
        </div>

        <!-- ===== ESTADO ===== -->
        <div id="estado">⏳ Cargando...</div>

        <!-- ===== GALERÍA ===== -->
        <div class="galeria" id="galeria"></div>

        <!-- ===== PIE ===== -->
        <div class="footer">OVJ STUDIO · Fotografía con alma</div>

        <!-- ===== MODAL ===== -->
        <div class="modal-fondo" id="modalFondo"></div>
        <div class="modal" id="modal">
            <div class="modal-contenido">
                <div class="imagen-wrapper">
                    <button class="btn-cerrar-modal" onclick="cerrarModal()">✕</button>
                    <button class="nav-flecha izquierda oculto" id="flechaIzquierda" onclick="navegarFoto(-1)">‹</button>
                    <img id="modalImagen" src="" alt="Foto ampliada" />
                    <button class="nav-flecha derecha oculto" id="flechaDerecha" onclick="navegarFoto(1)">›</button>
                </div>
                <div class="modal-footer">
                    <button class="btn-pedir" onclick="pedirFoto()">
                        <span class="icono-whatsapp">📱</span> Pedir foto gratis
                        sin marca de agua
                    </button>
                    <div class="mensaje-una-sola">
                        ⚡ <strong>Puedes pedir hasta 5 fotos</strong> · La
                        recibirás por WhatsApp en minutos
                    </div>
                </div>
            </div>
        </div>

        <script>
            // ==========================================
            // 🔥 CONFIGURACIÓN - URL ACTUAL DE CLOUDFLARE
            // ==========================================
            const URL_CLOUDFLARE =
                "https://contributor-greg-perspective-mat.trycloudflare.com";

            // 🔥 CONFIGURACIÓN DE CARGA PROGRESIVA
            const FOTOS_POR_CARGA = 6;

            // ==========================================
            // 📌 CAPTURAR EL ID DEL FOTÓGRAFO DESDE LA URL
            // ==========================================
            function getFotografoId() {
                const urlParams = new URLSearchParams(window.location.search);
                const id = urlParams.get("f");
                console.log(`🔍 ID del fotógrafo detectado: "${id}"`);
                return id || "default";
            }

            const FOTOGRAFO_ID = getFotografoId();
            document.getElementById("fotografoNombre").textContent =
                FOTOGRAFO_ID;

            // ==========================================
            // VARIABLES
            // ==========================================
            let fotosCache = [];
            let fotosVisibles = FOTOS_POR_CARGA;
            let fotoSeleccionadaIndex = -1;
            let cargando = false;
            let totalFotosAnterior = 0;

            // ==========================================
            // CARGAR FOTOS (CON EVENTO)
            // ==========================================

            async function cargarFotos() {
                if (cargando) return;
                cargando = true;

                const estado = document.getElementById("estado");

                try {
                    estado.innerHTML = "⏳ Cargando...";
                    estado.className = "cargando";

                    const respuesta = await fetch(
                        `${URL_CLOUDFLARE}/fotos?f=${FOTOGRAFO_ID}`,
                    );
                    if (!respuesta.ok)
                        throw new Error(`HTTP ${respuesta.status}`);

                    const data = await respuesta.json();

                    // 🔥 ACTUALIZAR EL TÍTULO DEL EVENTO
                    if (data.evento) {
                        document.getElementById("eventoTitulo").textContent = data.evento;
                    }

                    const nuevasFotos = data.fotos || [];
                    console.log("📸 Fotos recibidas:", nuevasFotos.length);

                    const huboCambio =
                        JSON.stringify(nuevasFotos) !==
                        JSON.stringify(fotosCache);

                    if (huboCambio) {
                        fotosCache = nuevasFotos;
                        renderizarGaleria();
                    }

                    // 🔥 ACTUALIZAR ESTADO CON CONTADOR DE VISIBLES
                    actualizarEstado();

                } catch (error) {
                    estado.innerHTML = `⚠️ Error: ${error.message}`;
                    estado.className = "error";
                    console.error("Error:", error);
                }

                cargando = false;
            }

            // ==========================================
            // ACTUALIZAR ESTADO (CONTADOR)
            // ==========================================
            function actualizarEstado() {
                const estado = document.getElementById("estado");

                if (fotosCache.length === 0) {
                    estado.innerHTML = "📷 No hay fotos aún";
                    estado.className = "ok";
                    return;
                }

                const visibles = Math.min(fotosVisibles, fotosCache.length);
                estado.innerHTML = `Mostrando <span class="num">${visibles}</span> de <span class="num">${fotosCache.length}</span> fotos`;
                estado.className = "ok";
            }

            // ==========================================
            // RENDERIZAR GALERÍA (CON CARGA PROGRESIVA)
            // ==========================================

            function renderizarGaleria() {
                const galeria = document.getElementById("galeria");

                if (!fotosCache || fotosCache.length === 0) {
                    galeria.innerHTML = "";
                    return;
                }

                const visibles = Math.min(fotosVisibles, fotosCache.length);
                let html = "";

                // 🔥 Renderizar solo las fotos visibles
                for (let i = 0; i < visibles; i++) {
                    const foto = fotosCache[i];
                    const urlImagen = `${URL_CLOUDFLARE}${foto.url}`;

                    html += `
                    <div class="foto" onclick="abrirModal('${foto.nombre}')">
                        <img src="${urlImagen}" alt="Foto ${i + 1}" loading="lazy"
                             onerror="console.error('❌ Error cargando:', '${urlImagen}'); this.style.opacity='0.3';">
                    </div>
                `;
                }

                // 🔥 Aviso de fotos nuevas
                const hayNuevas = fotosCache.length > totalFotosAnterior && totalFotosAnterior > 0;
                if (hayNuevas) {
                    const nuevas = fotosCache.length - totalFotosAnterior;
                    html += `
                    <div class="aviso-nuevas">
                        ✨ ${nuevas} ${nuevas === 1 ? 'foto nueva' : 'fotos nuevas'} disponible${nuevas === 1 ? '' : 's'}
                    </div>
                `;
                }

                // 🔥 Botón "Ver más fotos"
                if (visibles < fotosCache.length) {
                    const restantes = fotosCache.length - visibles;
                    html += `
                    <div class="ver-mas-wrapper">
                        <button class="btn-ver-mas" onclick="mostrarMasFotos()">
                            Ver más fotos ↓
                        </button>
                        <div class="info-restantes">
                            <strong>${restantes}</strong> ${restantes === 1 ? 'foto más' : 'fotos más'} por descubrir
                        </div>
                    </div>
                `;
                } else if (fotosCache.length > FOTOS_POR_CARGA) {
                    html += `
                    <div class="ver-mas-wrapper">
                        <div class="info-restantes">
                            ✨ Has visto todas las fotos disponibles
                        </div>
                    </div>
                `;
                }

                galeria.innerHTML = html;

                // Actualizar el total anterior
                totalFotosAnterior = fotosCache.length;
            }

            // ==========================================
            // 🔥 MOSTRAR MÁS FOTOS (CARGA PROGRESIVA)
            // ==========================================
            function mostrarMasFotos() {
                fotosVisibles += FOTOS_POR_CARGA;
                renderizarGaleria();
                actualizarEstado();

                setTimeout(() => {
                    const fotos = document.querySelectorAll('.foto');
                    if (fotos.length > 0) {
                        const ultimaFotoAnterior = fotos[Math.min(fotosVisibles - FOTOS_POR_CARGA - 1, fotos.length - 1)];
                        if (ultimaFotoAnterior) {
                            ultimaFotoAnterior.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }
                }, 100);
            }

            // ==========================================
            // 🖼️ MODAL CON EFECTOS PREMIUM
            // ==========================================

            function abrirModal(nombreFoto) {
                const index = fotosCache.findIndex(f => f.nombre === nombreFoto);
                if (index < 0) {
                    console.error(`❌ Foto no encontrada: ${nombreFoto}`);
                    return;
                }

                fotoSeleccionadaIndex = index;
                const foto = fotosCache[index];

                const modal = document.getElementById("modal");
                const fondo = document.getElementById("modalFondo");
                const modalImagen = document.getElementById("modalImagen");

                const wrapper = document.querySelector('.imagen-wrapper');
                wrapper.style.animation = 'none';
                void wrapper.offsetHeight;
                wrapper.style.animation = '';

                modalImagen.src = `${URL_CLOUDFLARE}${foto.url}`;
                modalImagen.alt = `Foto ${index + 1}`;

                modal.classList.add("activo");
                fondo.classList.add("activo");
                document.body.style.overflow = "hidden";

                actualizarFlechas();
            }

            function cerrarModal() {
                document.getElementById("modal").classList.remove("activo");
                document.getElementById("modalFondo").classList.remove("activo");
                document.body.style.overflow = "";
            }

            function actualizarFlechas() {
                const total = fotosCache.length;
                const flechaIzq = document.getElementById("flechaIzquierda");
                const flechaDer = document.getElementById("flechaDerecha");

                flechaIzq.classList.toggle("oculto", fotoSeleccionadaIndex <= 0);
                flechaDer.classList.toggle("oculto", fotoSeleccionadaIndex >= total - 1);
            }

            function navegarFoto(direccion) {
                const nuevoIndex = fotoSeleccionadaIndex + direccion;
                if (nuevoIndex < 0 || nuevoIndex >= fotosCache.length) return;

                fotoSeleccionadaIndex = nuevoIndex;
                const foto = fotosCache[nuevoIndex];
                const modalImagen = document.getElementById("modalImagen");

                const wrapper = document.querySelector('.imagen-wrapper');
                wrapper.style.animation = 'none';
                void wrapper.offsetHeight;
                wrapper.style.animation = '';

                modalImagen.src = `${URL_CLOUDFLARE}${foto.url}`;
                modalImagen.alt = `Foto ${nuevoIndex + 1}`;

                actualizarFlechas();
            }

            // ==========================================
            // PEDIR FOTO (ENVÍA EL NOMBRE EXACTO)
            // ==========================================

            function pedirFoto() {
                if (
                    fotoSeleccionadaIndex < 0 ||
                    fotoSeleccionadaIndex >= fotosCache.length
                ) {
                    alert("❌ No hay foto seleccionada");
                    return;
                }

                const foto = fotosCache[fotoSeleccionadaIndex];
                const mensaje = `Quiero mi foto: ${foto.nombre} (Fotógrafo: ${FOTOGRAFO_ID})`;

                const urlWhatsApp =
                    `https://wa.me/59160004962?text=${encodeURIComponent(mensaje)}`;

                window.open(urlWhatsApp, "_blank");
            }

            // ==========================================
            // EVENTOS
            // ==========================================

            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape") cerrarModal();
                if (e.key === "ArrowLeft") navegarFoto(-1);
                if (e.key === "ArrowRight") navegarFoto(1);
            });

            document.getElementById("modalFondo").addEventListener("click", (e) => {
                if (e.target === e.currentTarget) cerrarModal();
            });

            // ==========================================
            // INICIALIZAR
            // ==========================================

            cargarFotos();
            setInterval(cargarFotos, 60000);
        </script>
    </body>
</html>
