<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OVJ Studio - Galería</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #0a0a0a;
            color: white;
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            padding: 20px;
            border-bottom: 2px solid #333;
            margin-bottom: 30px;
        }
        h1 span { color: #ff6b35; }
        .subir {
            text-align: center;
            padding: 20px;
            background: #1a1a1a;
            border-radius: 10px;
            margin-bottom: 30px;
            border: 2px dashed #333;
        }
        .subir input, .subir button {
            padding: 10px;
            margin: 5px;
            border-radius: 5px;
            border: none;
        }
        .subir button {
            background: #ff6b35;
            color: white;
            cursor: pointer;
            padding: 10px 30px;
            font-weight: bold;
        }
        .subir button:hover { background: #e05a2a; }
        .subir input[type="file"] {
            background: #333;
            color: white;
            cursor: pointer;
        }
        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .foto {
            background: #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #333;
            transition: transform 0.3s;
        }
        .foto:hover { transform: scale(1.02); }
        .foto img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }
        .foto .info {
            padding: 12px;
            font-size: 12px;
            color: #888;
            text-align: center;
            background: #111;
        }
        .mensaje {
            text-align: center;
            padding: 30px;
            color: #666;
            font-size: 0.9rem;
            border-top: 1px solid #222;
            margin-top: 30px;
        }
        #estado {
            text-align: center;
            padding: 15px;
            margin: 20px 0;
            font-size: 1.1rem;
            background: #1a1a1a;
            border-radius: 10px;
        }
        .ok { color: #4CAF50; }
        .error { color: #ff4444; }
        .cargando { color: #ffaa00; }
        #subirEstado { margin-left: 10px; }
    </style>
</head>
<body>

    <h1>📸 OVJ <span>Studio</span></h1>

    <div class="subir">
        <input type="file" id="fileInput" accept="image/*" multiple>
        <button onclick="subirFotos()">📤 Subir fotos</button>
        <span id="subirEstado"></span>
    </div>
    
    <div id="estado">🔄 Cargando...</div>
    <div class="galeria" id="galeria"></div>
    <p class="mensaje">✨ Fotografías en vivo desde el evento</p>

    <script>
        // ==========================================
        // 🔥 ÚNICA CONFIGURACIÓN - CAMBIA ESTA URL
        // ==========================================
        const URL_CLOUDFLARE = 'https://app-briefs-archived-meetup.trycloudflare.com'; // <--- PON TU URL AQUÍ

        // ==========================================
        // FUNCIONES - NO TOCAR
        // ==========================================

        async function cargarFotos() {
            const estado = document.getElementById('estado');
            const galeria = document.getElementById('galeria');
            
            try {
                estado.innerHTML = '⏳ Cargando fotos...';
                estado.className = 'cargando';
                
                const respuesta = await fetch(`${URL_CLOUDFLARE}/fotos`);
                if (!respuesta.ok) throw new Error(`HTTP ${respuesta.status}`);
                
                const fotos = await respuesta.json();
                
                if (!fotos || fotos.length === 0) {
                    estado.innerHTML = '📷 No hay fotos aún. ¡Sube la primera!';
                    estado.className = 'ok';
                    galeria.innerHTML = '';
                    return;
                }
                
                estado.innerHTML = `✅ ${fotos.length} fotos disponibles`;
                estado.className = 'ok';
                
                galeria.innerHTML = fotos.map(foto => {
                    const urlImagen = `${URL_CLOUDFLARE}${foto.url}`;
                    return `
                        <div class="foto">
                            <img src="${urlImagen}" alt="${foto.nombre}" loading="lazy" 
                                 onerror="this.alt='❌ Error'; this.style.opacity='0.5';">
                            <div class="info">📷 ${foto.nombre}</div>
                        </div>
                    `;
                }).join('');
                
            } catch (error) {
                estado.innerHTML = `❌ Error: ${error.message}`;
                estado.className = 'error';
                console.error('Error:', error);
            }
        }

        async function subirFotos() {
            const input = document.getElementById('fileInput');
            const estado = document.getElementById('subirEstado');
            
            if (!input.files || input.files.length === 0) {
                estado.textContent = '❌ Selecciona una o más fotos';
                estado.style.color = '#ff4444';
                return;
            }
            
            const archivos = Array.from(input.files);
            let subidas = 0;
            let errores = 0;
            
            estado.textContent = `⏳ Subiendo ${archivos.length} fotos...`;
            estado.style.color = '#ffaa00';
            
            for (const archivo of archivos) {
                if (!archivo.type.startsWith('image/')) {
                    errores++;
                    continue;
                }
                
                const formData = new FormData();
                formData.append('foto', archivo);
                
                try {
                    const respuesta = await fetch(`${URL_CLOUDFLARE}/upload`, {
                        method: 'POST',
                        body: formData
                    });
                    
                    if (respuesta.ok) {
                        subidas++;
                    } else {
                        errores++;
                    }
                } catch (error) {
                    errores++;
                    console.error('Error subiendo:', archivo.name, error);
                }
            }
            
            estado.textContent = `✅ ${subidas} subidas, ${errores} errores`;
            estado.style.color = subidas > 0 ? '#4CAF50' : '#ff4444';
            input.value = '';
            
            if (subidas > 0) {
                setTimeout(cargarFotos, 2000);
            }
        }

        // ==========================================
        // INICIALIZAR
        // ==========================================
        
        cargarFotos();
        setInterval(cargarFotos, 8000);
    </script>
</body>
</html>
