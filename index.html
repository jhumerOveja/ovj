<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OVJ Studio - Galería</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #0a0a0a;
            color: white;
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            padding: 20px;
            border-bottom: 2px solid #333;
            margin-bottom: 30px;
        }
        h1 span { color: #ff6b35; }
        .subir {
            text-align: center;
            padding: 20px;
            background: #1a1a1a;
            border-radius: 10px;
            margin-bottom: 30px;
            border: 2px dashed #333;
        }
        .subir input, .subir button {
            padding: 10px;
            margin: 5px;
            border-radius: 5px;
            border: none;
        }
        .subir button {
            background: #ff6b35;
            color: white;
            cursor: pointer;
            padding: 10px 30px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .subir button:hover { background: #e05a2a; }
        .subir input[type="file"] {
            background: #333;
            color: white;
            cursor: pointer;
        }
        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .foto {
            background: #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #333;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .foto:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 25px rgba(255, 107, 53, 0.2);
        }
        .foto img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }
        .foto .info {
            padding: 12px;
            font-size: 12px;
            color: #888;
            text-align: center;
            background: #111;
        }
        .mensaje {
            text-align: center;
            padding: 30px;
            color: #666;
            font-size: 0.9rem;
            border-top: 1px solid #222;
            margin-top: 30px;
        }
        #estado {
            text-align: center;
            padding: 15px;
            margin: 20px 0;
            font-size: 1.1rem;
            background: #1a1a1a;
            border-radius: 10px;
        }
        .ok { color: #4CAF50; }
        .error { color: #ff4444; }
        .cargando { color: #ffaa00; }
        #subirEstado { margin-left: 10px; }

        /* 🔥 Panel Admin (solo visible para ti) */
        .admin-panel {
            background: #1a1a1a;
            border: 2px solid #ff6b35;
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: none; /* Oculto por defecto */
        }
        .admin-panel.visible {
            display: block; /* Se muestra con un truco */
        }
        .admin-panel h3 {
            color: #ff6b35;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .admin-panel input {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 5px;
            width: 70%;
            max-width: 400px;
        }
        .admin-panel button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
        }
        .admin-panel button:hover { background: #45a049; }
        .admin-panel .url-actual {
            color: #888;
            font-size: 12px;
            margin-top: 8px;
        }
        .admin-panel .url-actual span {
            color: #4CAF50;
            word-break: break-all;
        }
        .admin-toggle {
            text-align: right;
            font-size: 11px;
            color: #444;
            cursor: pointer;
            margin-bottom: 5px;
            user-select: none;
        }
        .admin-toggle:hover { color: #666; }
    </style>
</head>
<body>

    <!-- 🔥 TEXTO PARA ACTIVAR EL PANEL ADMIN (truco: haz clic 3 veces en el título) -->
    <div class="admin-toggle" onclick="toggleAdmin()">⚙️ Admin</div>

    <!-- 🔥 PANEL ADMIN (oculto, solo para ti) -->
    <div class="admin-panel" id="adminPanel">
        <h3>⚙️ CONFIGURACIÓN DEL SERVIDOR</h3>
        <p style="color:#888; font-size:13px; margin-bottom:10px;">
            Cambia esta URL cuando inicies Cloudflare Tunnel en tu laptop
        </p>
        <input type="text" id="servidorUrl" placeholder="https://xxxx.trycloudflare.com">
        <button onclick="guardarUrl()">💾 Guardar</button>
        <div class="url-actual">
            URL actual: <span id="urlActual">No configurada</span>
        </div>
    </div>

    <h1>📸 OVJ <span>Studio</span></h1>

    <div class="subir">
        <input type="file" id="fileInput" accept="image/*" multiple>
        <button onclick="subirFotos()">📤 Subir fotos</button>
        <span id="subirEstado"></span>
    </div>
    
    <div id="estado">🔄 Cargando...</div>
    <div class="galeria" id="galeria"></div>
    <p class="mensaje">✨ Fotografías en vivo desde el evento</p>

    <script>
        // ==========================================
        // 🔥 CLAVE: La URL se guarda en localStorage
        // ==========================================

        function getServidorUrl() {
            let url = localStorage.getItem('servidorUrl');
            if (!url) {
                // Si no hay URL guardada, usa localhost por defecto
                url = window.location.hostname === 'localhost' 
                    ? 'http://localhost:3000' 
                    : '';
                localStorage.setItem('servidorUrl', url);
            }
            return url;
        }

        function guardarUrl() {
            const input = document.getElementById('servidorUrl');
            const url = input.value.trim();
            if (url) {
                localStorage.setItem('servidorUrl', url);
                document.getElementById('urlActual').textContent = url;
                cargarFotos();
                alert('✅ URL guardada correctamente');
            } else {
                alert('❌ Ingresa una URL válida');
            }
        }

        function mostrarUrlActual() {
            const url = getServidorUrl();
            document.getElementById('urlActual').textContent = url || 'No configurada';
            document.getElementById('servidorUrl').value = url || '';
        }

        // 🔥 Truco para mostrar el panel admin: hacer clic 3 veces en "Admin"
        function toggleAdmin() {
            const panel = document.getElementById('adminPanel');
            panel.classList.toggle('visible');
            // Ocultar el texto después de mostrar el panel
            document.querySelector('.admin-toggle').style.display = 'none';
        }

        // ==========================================
        // FUNCIONES PRINCIPALES
        // ==========================================

        async function cargarFotos() {
            const servidor = getServidorUrl();
            if (!servidor) {
                document.getElementById('estado').innerHTML = '⚠️ Configura la URL del servidor (haz clic en "Admin" arriba)';
                document.getElementById('estado').className = 'error';
                return;
            }

            try {
                const respuesta = await fetch(`${servidor}/fotos`);
                if (!respuesta.ok) throw new Error('Error en la respuesta');
                
                const fotos = await respuesta.json();
                const galeria = document.getElementById('galeria');
                const estado = document.getElementById('estado');
                
                if (!fotos || fotos.length === 0) {
                    estado.innerHTML = '📷 No hay fotos aún. ¡Sube la primera!';
                    estado.className = 'ok';
                    galeria.innerHTML = '';
                    return;
                }
                
                estado.innerHTML = `✅ ${fotos.length} fotos disponibles`;
                estado.className = 'ok';
                
                galeria.innerHTML = fotos.map(foto => `
                    <div class="foto">
                        <img src="${servidor}${foto.url}" alt="${foto.nombre}" loading="lazy" 
                             onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect width=%22200%22 height=%22200%22 fill=%22%23333%22/%3E%3Ctext x=%2250%22 y=%22115%22 font-size=%2220%22 fill=%22%23666%22 font-family=%22Arial%22%3E❌ Error%3C/text%3E%3C/svg%3E'">
                        <div class="info">📷 ${foto.nombre}</div>
                    </div>
                `).join('');
                
            } catch (error) {
                document.getElementById('estado').innerHTML = '❌ Error al cargar fotos - ¿Servidor encendido?';
                document.getElementById('estado').className = 'error';
                console.error('Error:', error);
            }
        }

        async function subirFotos() {
            const input = document.getElementById('fileInput');
            const estado = document.getElementById('subirEstado');
            const servidor = getServidorUrl();
            
            if (!servidor) {
                estado.textContent = '❌ Configura la URL del servidor primero (Admin)';
                estado.style.color = '#ff4444';
                return;
            }
            
            if (!input.files || input.files.length === 0) {
                estado.textContent = '❌ Selecciona una o más fotos';
                estado.style.color = '#ff4444';
                return;
            }
            
            const archivos = Array.from(input.files);
            let subidas = 0;
            let errores = 0;
            
            estado.textContent = `⏳ Subiendo ${archivos.length} fotos...`;
            estado.style.color = '#ffaa00';
            
            for (const archivo of archivos) {
                if (!archivo.type.startsWith('image/')) {
                    errores++;
                    continue;
                }
                
                const formData = new FormData();
                formData.append('foto', archivo);
                
                try {
                    const respuesta = await fetch(`${servidor}/upload`, {
                        method: 'POST',
                        body: formData
                    });
                    
                    if (respuesta.ok) {
                        subidas++;
                    } else {
                        errores++;
                    }
                } catch (error) {
                    errores++;
                    console.error('Error subiendo:', archivo.name, error);
                }
            }
            
            estado.textContent = `✅ ${subidas} subidas, ${errores} errores`;
            estado.style.color = subidas > 0 ? '#4CAF50' : '#ff4444';
            input.value = '';
            
            if (subidas > 0) {
                setTimeout(cargarFotos, 1000);
            }
        }

        // ==========================================
        // INICIALIZAR
        // ==========================================
        
        mostrarUrlActual();
        cargarFotos();
        setInterval(cargarFotos, 5000);
    </script>
</body>
</html>
