            await cargarListaTickets(fotografo, eventoId);
        }

        async function cargarListaTickets(fotografo, eventoId) {
            const cont = $('listaTicketsContainer');
            if (!cont) return;

            try {
                const data = await apiFetch('/admin/tickets?f=' + encodeURIComponent(fotografo) + '&e=' + encodeURIComponent(eventoId));
                const tickets = data.tickets || [];

                if (tickets.length === 0) {
                    cont.innerHTML = `
                <div class="vacio">
                    <span class="emoji">📭</span>
                    <div class="titulo">Sin tickets emitidos</div>
                    <div class="subtitulo">Se emitirán automáticamente a la hora configurada.</div>
                </div>
            `;
                    return;
                }

                // Separar por tipo
                const reales = tickets.filter(t => t.tipo !== 'simbolico');
                const simbolicos = tickets.filter(t => t.tipo === 'simbolico');

                let html = '';

                // Resumen
                html += `
            <div style="display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap;">
                <div style="background:rgba(232,196,122,0.08); border:1px solid rgba(232,196,122,0.3); border-radius:10px; padding:8px 12px; font-size:0.75rem;">
                    <strong style="color:#e8c47a; font-size:1rem;">${reales.length}</strong>
                    <span style="color:#aaa;"> tickets reales</span>
                </div>
                <div style="background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:10px; padding:8px 12px; font-size:0.75rem;">
                    <strong style="color:#fff; font-size:1rem;">${simbolicos.length}</strong>
                    <span style="color:#aaa;"> simbólicos</span>
                </div>
                <div style="background:rgba(74,222,128,0.08); border:1px solid rgba(74,222,128,0.3); border-radius:10px; padding:8px 12px; font-size:0.75rem;">
                    <strong style="color:#4ade80; font-size:1rem;">${reales.filter(t => t.cobrado).length}</strong>
                    <span style="color:#aaa;"> cobrados</span>
                </div>
            </div>
        `;

                // Lista de tickets reales
                if (reales.length > 0) {
                    html += `<div style="font-size:0.68rem; color:#e8c47a; text-transform:uppercase; letter-spacing:1.5px; margin: 14px 0 8px;">Tickets reales</div>`;

                    reales.forEach(t => {
                        html += renderItemTicket(t);
                    });
                }

                // Lista de simbólicos (colapsable)
                if (simbolicos.length > 0) {
                    html += `
                <div style="font-size:0.68rem; color:#888; text-transform:uppercase; letter-spacing:1.5px; margin: 18px 0 8px; cursor:pointer; user-select:none;" onclick="toggleSimbolicosTickets()">
                    <span id="toggleSimbolicosIcono">▶</span> Simbólicos (${simbolicos.length})
                </div>
                <div id="listaSimbolicosTickets" style="display:none;">
            `;

                    simbolicos.forEach(t => {
                        html += renderItemTicket(t, true);
                    });

                    html += `</div>`;
                }

                cont.innerHTML = html;

            } catch (e) {
                cont.innerHTML = `
            <div class="vacio">
                <span class="emoji">❌</span>
                <div class="titulo">Error</div>
                <div class="subtitulo">${escapeHtml(e.message)}</div>
            </div>
        `;
            }
        }

        function renderItemTicket(t, esSimbolico = false) {
            const cobrado = !!t.cobrado;
            const reclamado = !!t.reclamado;
            const abierto = !!t.abierto;

            const colorBorde = cobrado ? 'rgba(74,222,128,0.25)' : (esSimbolico ? 'rgba(255,255,255,0.06)' : 'rgba(232,196,122,0.25)');
            const colorFondo = cobrado ? 'rgba(74,222,128,0.04)' : (esSimbolico ? 'rgba(255,255,255,0.02)' : 'rgba(232,196,122,0.03)');

            let badges = '';
            if (cobrado) badges += `<span style="background:rgba(74,222,128,0.15); color:#4ade80; font-size:0.58rem; font-weight:700; padding:2px 7px; border-radius:50px; letter-spacing:0.5px;">COBRADO</span>`;
            if (reclamado && !cobrado) badges += `<span style="background:rgba(96,165,250,0.15); color:#93c5fd; font-size:0.58rem; font-weight:700; padding:2px 7px; border-radius:50px; letter-spacing:0.5px; margin-left:4px;">RECLAMADO</span>`;
            if (abierto && !reclamado && !cobrado) badges += `<span style="background:rgba(255,255,255,0.06); color:#aaa; font-size:0.58rem; font-weight:700; padding:2px 7px; border-radius:50px; letter-spacing:0.5px; margin-left:4px;">ABIERTO</span>`;

            return `
        <div style="background:${colorFondo}; border:1px solid ${colorBorde}; border-radius:12px; padding:12px 14px; margin-bottom:8px;">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; margin-bottom:6px;">
                <div style="flex:1; min-width:0;">
                    <div style="font-size:0.85rem; font-weight:700; color:#fff; word-break:break-word;">${escapeHtml(t.invitadoNombre || 'Invitado')}</div>
                    <div style="font-size:0.62rem; color:#666; margin-top:2px; text-transform:uppercase; letter-spacing:0.5px;">${escapeHtml(t.invitadoTipo || 'invitado')}</div>
                </div>
                <div>${badges}</div>
            </div>

            <div style="font-size:0.78rem; color:#e8c47a; margin-bottom:4px;">🎁 ${escapeHtml(t.titulo)}</div>
            <div style="font-size:0.68rem; color:#888; margin-bottom:8px; line-height:1.4;">${escapeHtml(t.descripcion)}</div>

            <div style="background:rgba(0,0,0,0.25); border:1px solid rgba(255,255,255,0.06); border-radius:8px; padding:6px 10px; margin-bottom:8px; font-family:monospace; font-size:0.68rem; color:#93c5fd; word-break:break-all;">
                ${escapeHtml(t.token)}
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; font-size:0.62rem; color:#666;">
                <span>Emitido: ${formatearHora(t.emitidoEn)}</span>
                <span>Vence: ${new Date(t.expiraEn).toLocaleDateString('es-BO', { day: '2-digit', month: 'short', year: 'numeric' })}</span>
            </div>

            ${!cobrado && !esSimbolico ? `
                <div style="margin-top:10px;">
                    <button class="btn btn-chico btn-verde" onclick="cobrarTicket('${escapeHtml(t.id)}')" style="width:100%;">
                        ✅ Marcar como cobrado
                    </button>
                </div>
            ` : ''}

            ${cobrado ? `
                <div style="margin-top:8px; font-size:0.65rem; color:#4ade80; text-align:center;">
                    ✅ Cobrado ${t.cobradoEn ? 'el ' + formatearHora(t.cobradoEn) : ''}
                </div>
            ` : ''}
        </div>
    `;
        }

        function toggleSimbolicosTickets() {
            const cont = $('listaSimbolicosTickets');
            const icono = $('toggleSimbolicosIcono');
            if (!cont || !icono) return;

            const visible = cont.style.display !== 'none';
            cont.style.display = visible ? 'none' : 'block';
            icono.textContent = visible ? '▶' : '▼';
        }

        async function cobrarTicket(ticketId) {
            if (!ticketsEventoSeleccionado) return;

            if (!confirm('¿Marcar este ticket como cobrado?\n\nDespués de esto no se puede deshacer.')) return;

            loader(true);
            try {
                const { fotografo, eventoId } = ticketsEventoSeleccionado;

                await apiFetch('/admin/tickets/' + encodeURIComponent(ticketId) + '/cobrar?f=' + encodeURIComponent(fotografo) + '&e=' + encodeURIComponent(eventoId), {
                    method: 'POST'
                });

                toast('✅ Ticket marcado como cobrado', 'ok');

                // Refrescar la lista
                await cargarListaTickets(fotografo, eventoId);

            } catch (e) {
                toast('Error: ' + e.message, 'error');
            } finally {
                loader(false);
            }
        }

                <div class="card" style="margin-bottom:20px;">
                    <div style="font-size:0.95rem; font-weight:700; color:#fff; margin-bottom:10px;">ℹ️ Info del sistema</div>
                    <div style="font-size:0.78rem; color:#aaa; line-height:1.8;">
                        <div>🌐 API: <code style="color:#f39c12;">${URL_API}</code></div>
                        <div>📄 Frontend invitados: <code style="color:#f39c12;">https://jhumeroveja.github.io/ovj/</code></div>
                        <div>📄 Panel fotógrafo: <code style="color:#f39c12;">https://jhumeroveja.github.io/ovj/fotografo.html</code></div>
                        <div>📄 Panel admin: <code style="color:#f39c12;">https://jhumeroveja.github.io/ovj/administracion.html</code></div>
                    </div>
                </div>
            `;
        }

        async function verLogs(tipo) {
            loader(true);
            try {
                const data = await apiFetch('/admin/logs?tipo=' + encodeURIComponent(tipo));
                const lineas = (data.lineas || []).join('\n');
                abrirModal(`
                    <button class="btn-cerrar" onclick="cerrarModal()">✕</button>
                    <div class="titulo">📄 Logs: ${escapeHtml(tipo)}</div>
                    <div class="subtitulo">Últimas ${data.lineas?.length || 0} líneas</div>
                    <div class="logs-box">${escapeHtml(lineas || '(vacío)')}</div>
                    <button class="btn-secundario" onclick="cerrarModal()">Cerrar</button>
                `);
            } catch (e) {
                toast('Error: ' + e.message, 'error');
            } finally {
                loader(false);
            }
        }

        function confirmarLimpiarB2() {
            abrirModal(`
        <button class="btn-cerrar" onclick="cerrarModal()">✕</button>
        <div class="titulo" style="color:#e74c3c;">⚠️ Limpiar Backblaze B2</div>
        <div class="subtitulo">
            Esto borrará <strong>TODAS</strong> las fotos de B2 (originales + previews) de todos los eventos.<br><br>
            La limpieza corre en <strong>background</strong>. Puede tardar varios minutos.<br><br>
            <strong>Esta acción no se puede deshacer.</strong>
        </div>
        <button class="btn-peligro" onclick="ejecutarLimpiarB2()">Sí, limpiar TODO</button>
        <button class="btn-secundario" onclick="cerrarModal()">Cancelar</button>
    `);
        }

        async function ejecutarLimpiarB2() {
            loader(true);
            cerrarModal();
            try {
                const data = await apiFetch('/admin/limpiar-b2', { method: 'POST' });
                if (data.iniciado) {
                    toast('🧹 Limpieza de B2 iniciada en background. Revisa los logs.', 'ok');
                } else {
                    toast('⚠️ ' + (data.error || 'No se pudo iniciar'), 'error');
                }
            } catch (e) {
                toast('Error: ' + e.message, 'error');
            } finally {
                loader(false);
            }
        }

        // ==========================================
        // 🪟 MODAL
        // ==========================================
        function abrirModal(html) {
            $('modalContenido').innerHTML = html;
            $('modal').classList.add('activo');
        }

        function cerrarModal() {
            $('modal').classList.remove('activo');
            $('modalContenido').innerHTML = '';
        }

        $('modal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) cerrarModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') cerrarModal();
        });

        // ==========================================
        // 🚀 INICIALIZACIÓN
        // ==========================================
        function inicializar() {
            if (cargarSesionLocal()) {
                mostrarApp();
                cambiarTab('dashboard');
            } else {
                mostrarLogin();
            }
        }

        $('inputToken').addEventListener('keydown', e => {
            if (e.key === 'Enter') hacerLogin();
        });

        inicializar();
    </script>
</body>

</html>
