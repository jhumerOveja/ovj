<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OVJ Studio · Administración</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --oro: #f39c12;
            --oro-claro: #f1c40f;
            --verde: #2ecc71;
            --rojo: #e74c3c;
            --azul: #3498db;
            --violeta: #9b59b6;
            --champagne: #e8c47a;
            --bg: #0a0a0a;
            --card: #141414;
            --card-borde: rgba(255, 215, 0, 0.15);
            --texto: #fff;
            --texto-suave: #aaa;
            --texto-tenue: #666;
        }

        body {
            font-family: "Segoe UI", "PingFang SC", Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--texto);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== LOGIN ===== */
        #pantallaLogin {
            display: none;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #pantallaLogin.activo {
            display: flex;
        }

        .login-card {
            background: var(--card);
            border: 1px solid var(--card-borde);
            border-radius: 20px;
            padding: 32px 24px 28px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
        }

        .login-card .marca {
            text-align: center;
            margin-bottom: 24px;
        }

        .login-card .marca .ovj {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .login-card .marca .ovj span {
            font-weight: 700;
            background: linear-gradient(135deg, #f9d976, #f39c12);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-card .marca .rol {
            font-size: 0.72rem;
            color: var(--texto-tenue);
            letter-spacing: 3px;
            margin-top: 4px;
            text-transform: uppercase;
        }

        .login-card label {
            display: block;
            font-size: 0.72rem;
            color: var(--texto-suave);
            margin-bottom: 6px;
            padding-left: 4px;
            letter-spacing: 0.3px;
        }

        .login-card input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            font-family: monospace;
            margin-bottom: 16px;
            transition: all 0.2s;
        }

        .login-card input:focus {
            border-color: rgba(255, 215, 0, 0.4);
            background: rgba(255, 255, 255, 0.06);
        }

        .login-card .btn-login {
            width: 100%;
            padding: 15px 20px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #f39c12, #d68910);
            color: #0a0a0a;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
        }

        .login-card .btn-login:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(243, 156, 18, 0.3);
        }

        .login-card .btn-login:disabled {
            opacity: 0.5;
            cursor: wait;
            pointer-events: none;
        }

        .login-card .error-login {
            display: none;
            margin-top: 14px;
            padding: 10px 14px;
            background: rgba(231, 76, 60, 0.1);
            border: 1px solid rgba(231, 76, 60, 0.3);
            border-radius: 10px;
            color: #e74c3c;
            font-size: 0.78rem;
            text-align: center;
            line-height: 1.4;
        }

        .login-card .error-login.activo {
            display: block;
        }

        .login-card .ayuda {
            margin-top: 16px;
            font-size: 0.7rem;
            color: var(--texto-tenue);
            text-align: center;
            line-height: 1.5;
        }

        /* ===== APP ===== */
        #app {
            display: none;
        }

        #app.activo {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 220px;
            background: var(--card);
            border-right: 1px solid rgba(255, 255, 255, 0.04);
            padding: 24px 14px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }

        .sidebar .logo {
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 1px;
            padding: 0 10px 6px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.08);
        }

        .sidebar .logo span {
            font-weight: 700;
            background: linear-gradient(135deg, #f9d976, #f39c12);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar .logo .sub {
            display: block;
            font-size: 0.62rem;
            color: var(--texto-tenue);
            letter-spacing: 3px;
            margin-top: 4px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .sidebar nav {
            flex: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 12px;
            border-radius: 10px;
            color: var(--texto-suave);
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 4px;
            user-select: none;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
        }

        .nav-item.activo {
            background: rgba(243, 156, 18, 0.12);
            color: var(--oro);
            font-weight: 600;
        }

        .nav-item .emoji {
            font-size: 1rem;
        }

        .sidebar .footer-sidebar {
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 0.68rem;
            color: var(--texto-tenue);
        }

        .sidebar .btn-salir {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: #ccc;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            margin-bottom: 10px;
            transition: all 0.2s;
        }

        .sidebar .btn-salir:hover {
            background: rgba(231, 76, 60, 0.12);
            border-color: rgba(231, 76, 60, 0.3);
            color: var(--rojo);
        }

        /* CONTENIDO */
        .contenido {
            flex: 1;
            padding: 26px 28px 40px;
            overflow-y: auto;
            max-height: 100vh;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .page-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .page-header .subtitulo {
            font-size: 0.78rem;
            color: var(--texto-tenue);
            margin-top: 4px;
        }

        .page-header .acciones {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* BOTONES */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 16px;
            border-radius: 10px;
            border: none;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            text-decoration: none;
            line-height: 1.2;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }

        .btn:hover:not(:disabled) {
            transform: scale(1.02);
        }

        .btn-primario {
            background: linear-gradient(135deg, #f39c12, #d68910);
            color: #0a0a0a;
        }

        .btn-primario:hover:not(:disabled) {
            box-shadow: 0 6px 20px rgba(243, 156, 18, 0.3);
        }

        .btn-secundario {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ccc;
        }

        .btn-secundario:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .btn-peligro {
            background: rgba(231, 76, 60, 0.12);
            border: 1px solid rgba(231, 76, 60, 0.3);
            color: var(--rojo);
        }

        .btn-peligro:hover:not(:disabled) {
            background: rgba(231, 76, 60, 0.2);
        }

        .btn-verde {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: #0a0a0a;
        }

        .btn-chico {
            padding: 7px 12px;
            font-size: 0.72rem;
        }

        /* CARDS */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 14px;
        }

        .grid-2 {
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        }

        .card {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 18px 20px;
            transition: all 0.2s;
        }

        .card:hover {
            border-color: rgba(243, 156, 18, 0.2);
        }

        .card-stat {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .card-stat .emoji {
            font-size: 2rem;
            flex-shrink: 0;
        }

        .card-stat .info {
            flex: 1;
            min-width: 0;
        }

        .card-stat .valor {
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            line-height: 1;
        }

        .card-stat .etiqueta {
            font-size: 0.72rem;
            color: var(--texto-tenue);
            margin-top: 4px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .card-fotografo {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-fotografo .cabecera {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .card-fotografo .nombre {
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
            word-break: break-word;
        }

        .card-fotografo .chatid {
            font-size: 0.7rem;
            color: var(--texto-tenue);
            font-family: monospace;
            margin-top: 2px;
        }

        .card-fotografo .pin-box {
            background: rgba(243, 156, 18, 0.08);
            border: 1px solid rgba(243, 156, 18, 0.25);
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-fotografo .pin-box .label {
            font-size: 0.7rem;
            color: var(--texto-tenue);
        }

        .card-fotografo .pin-box .pin {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--oro);
            letter-spacing: 2px;
            font-family: monospace;
        }

        .card-fotografo .stats {
            display: flex;
            gap: 12px;
            font-size: 0.72rem;
            color: var(--texto-suave);
        }

        .card-fotografo .stats strong {
            color: #fff;
        }

        .card-fotografo .acciones {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .card-evento {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-evento .cabecera {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .card-evento .titulo {
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            word-break: break-word;
        }

        .card-evento .fotografo {
            font-size: 0.72rem;
            color: var(--texto-tenue);
            margin-top: 2px;
        }

        .card-evento .meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 0.78rem;
            color: var(--texto-suave);
        }

        .card-evento .meta .fila {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .card-evento .meta strong {
            color: #fff;
            font-weight: 600;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 4px 10px;
            border-radius: 50px;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .badge.activo {
            background: rgba(46, 204, 113, 0.15);
            color: var(--verde);
        }

        .badge.agendado {
            background: rgba(52, 152, 219, 0.15);
            color: var(--azul);
        }

        .badge.finalizado {
            background: rgba(255, 255, 255, 0.06);
            color: var(--texto-tenue);
        }

        .badge.cancelado {
            background: rgba(231, 76, 60, 0.15);
            color: var(--rojo);
        }

        /* TABLA */
        .tabla-wrapper {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
        }

        th {
            text-align: left;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            font-size: 0.68rem;
            color: var(--texto-tenue);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            color: var(--texto-suave);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        td .principal {
            color: #fff;
            font-weight: 600;
        }

        td .secundario {
            font-size: 0.72rem;
            color: var(--texto-tenue);
            margin-top: 2px;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(12px);
        }

        .modal.activo {
            display: flex;
        }

        .modal-contenido {
            background: var(--card);
            border: 1px solid var(--card-borde);
            border-radius: 20px;
            padding: 28px 24px 22px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: zoomIn 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
            position: relative;
        }

        @keyframes zoomIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-contenido .btn-cerrar {
            position: absolute;
            top: 12px;
            right: 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #888;
            font-size: 1.1rem;
            cursor: pointer;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
        }

        .modal-contenido .btn-cerrar:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .modal-contenido .titulo {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--oro-claro);
            margin-bottom: 6px;
            text-align: center;
        }

        .modal-contenido .subtitulo {
            font-size: 0.8rem;
            color: var(--texto-suave);
            text-align: center;
            margin-bottom: 22px;
            line-height: 1.5;
        }

        .campo {
            margin-bottom: 14px;
        }

        .campo label {
            display: block;
            font-size: 0.72rem;
            color: var(--texto-suave);
            margin-bottom: 6px;
            padding-left: 4px;
            letter-spacing: 0.3px;
        }

        .campo input,
        .campo select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            font-family: inherit;
            transition: all 0.2s;
        }

        .campo input:focus,
        .campo select:focus {
            border-color: rgba(255, 215, 0, 0.3);
            background: rgba(255, 255, 255, 0.06);
        }

        .campo .ayuda {
            font-size: 0.66rem;
            color: var(--texto-tenue);
            margin-top: 5px;
            padding-left: 4px;
        }

        .campo-fila {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .seccion-titulo-form {
            font-size: 0.7rem;
            color: var(--texto-tenue);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 20px 0 10px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-weight: 600;
        }

        .seccion-titulo-form.destacado {
            color: var(--champagne);
            border-top-color: rgba(232, 196, 122, 0.2);
        }

        .config-sugerida {
            background: rgba(243, 156, 18, 0.06);
            border: 1px dashed rgba(243, 156, 18, 0.3);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.72rem;
            color: var(--texto-suave);
            line-height: 1.5;
            margin-bottom: 14px;
        }

        .config-sugerida strong {
            color: var(--oro);
            font-weight: 600;
        }

        .btn-sugerir {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(52, 152, 219, 0.35);
            background: rgba(52, 152, 219, 0.1);
            color: #5dade2;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
            margin-bottom: 12px;
        }

        .btn-sugerir:hover {
            background: rgba(52, 152, 219, 0.2);
            transform: scale(1.01);
        }

        .qr-token-wrapper {
            background: #fff;
            border-radius: 12px;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 16px auto;
            width: 260px;
            height: 260px;
        }

        .qr-token-wrapper img {
            display: block;
            width: 240px;
            height: 240px;
            border-radius: 4px;
        }

        .token-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.7rem;
            color: #888;
            word-break: break-all;
            margin-bottom: 14px;
            font-family: monospace;
            line-height: 1.4;
            text-align: left;
        }

        .modal-contenido .btn-primario,
        .modal-contenido .btn-secundario,
        .modal-contenido .btn-peligro {
            width: 100%;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 700;
            margin-top: 8px;
        }

        /* LOGS */
        .logs-box {
            background: #050505;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 16px;
            font-family: monospace;
            font-size: 0.72rem;
            color: #bbb;
            line-height: 1.5;
            max-height: 500px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--card);
            border: 1px solid var(--card-borde);
            color: #fff;
            padding: 12px 20px;
            border-radius: 50px;
            font-size: 0.82rem;
            font-weight: 500;
            z-index: 3000;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            max-width: 90vw;
            text-align: center;
            pointer-events: none;
        }

        .toast.activo {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.ok {
            border-color: rgba(46, 204, 113, 0.4);
        }

        .toast.error {
            border-color: rgba(231, 76, 60, 0.4);
        }

        /* LOADER */
        .loader-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .loader-overlay.activo {
            display: flex;
        }

        .loader-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(243, 156, 18, 0.2);
            border-top-color: var(--oro);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* VACÍO */
        .vacio {
            text-align: center;
            padding: 50px 20px;
            color: var(--texto-tenue);
        }

        .vacio .emoji {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .vacio .titulo {
            font-size: 1rem;
            color: var(--texto-suave);
            margin-bottom: 6px;
        }

        .vacio .subtitulo {
            font-size: 0.78rem;
            line-height: 1.5;
        }

        /* RESPONSIVE */
        @media (max-width: 800px) {
            #app.activo {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.04);
                padding: 14px;
            }

            .sidebar .logo {
                margin-bottom: 12px;
                padding-bottom: 10px;
            }

            .sidebar nav {
                display: flex;
                gap: 6px;
                overflow-x: auto;
                padding-bottom: 6px;
            }

            .nav-item {
                margin-bottom: 0;
                white-space: nowrap;
                flex-shrink: 0;
                padding: 8px 12px;
                font-size: 0.75rem;
            }

            .nav-item .texto-nav {
                display: none;
            }

            .nav-item .emoji {
                font-size: 1.15rem;
            }

            .sidebar .footer-sidebar {
                display: none;
            }

            .contenido {
                padding: 18px 16px 40px;
                max-height: none;
            }

            .page-header h1 {
                font-size: 1.2rem;
            }

            .tabla-wrapper {
                overflow-x: auto;
            }

            table {
                min-width: 600px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .grid-2 {
                grid-template-columns: 1fr;
            }

            .campo-fila {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- ===== LOGIN ===== -->
    <div id="pantallaLogin">
        <div class="login-card">
            <div class="marca">
                <div class="ovj">OVJ <span>Studio</span></div>
                <div class="rol">Administración</div>
            </div>

            <label for="inputToken">Token de administrador</label>
            <input type="password" id="inputToken" placeholder="Pega el token aquí" autocomplete="off" />

            <button class="btn-login" id="btnLogin" onclick="hacerLogin()">Entrar</button>

            <div class="error-login" id="errorLogin"></div>

            <div class="ayuda">
                El token está en <code>config.json</code> → <code>admin.token</code>.
            </div>
        </div>
    </div>

    <!-- ===== APP ===== -->
    <div id="app">
        <aside class="sidebar">
            <div class="logo">
                OVJ <span>Studio</span>
                <span class="sub">Admin</span>
            </div>

            <nav>
                <div class="nav-item activo" data-tab="dashboard" onclick="cambiarTab('dashboard')">
                    <span class="emoji">📊</span>
                    <span class="texto-nav">Dashboard</span>
                </div>
                <div class="nav-item" data-tab="fotografos" onclick="cambiarTab('fotografos')">
                    <span class="emoji">👥</span>
                    <span class="texto-nav">Fotógrafos</span>
                </div>
                <div class="nav-item" data-tab="eventos" onclick="cambiarTab('eventos')">
                    <span class="emoji">📅</span>
                    <span class="texto-nav">Eventos</span>
                </div>
                <div class="nav-item" data-tab="sistema" onclick="cambiarTab('sistema')">
                    <span class="emoji">⚙️</span>
                    <span class="texto-nav">Sistema</span>
                </div>
                <div class="nav-item" data-tab="tickets" onclick="cambiarTab('tickets')">
                    <span class="emoji">🎁</span>
                    <span class="texto-nav">Tickets</span>
                </div>
            </nav>

            <div class="footer-sidebar">
                <button class="btn-salir" onclick="hacerLogout()">Cerrar sesión</button>
                <div style="text-align:center;">OVJ Studio · Admin</div>
            </div>
        </aside>

        <main class="contenido" id="contenidoPrincipal">
            <!-- Se inyecta por JS -->
        </main>
    </div>

    <!-- Modales -->
    <div class="modal" id="modal">
        <div class="modal-contenido" id="modalContenido">
            <!-- Se inyecta por JS -->
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Loader -->
    <div class="loader-overlay" id="loader">
        <div class="loader-spinner"></div>
    </div>
    <script src="qrcode.min.js"></script>
    <!-- 🔥 Configuración externa (editar config.js, NO este archivo) -->
    <script src="config.js"></script>

    <script>
        // ==========================================
        // ⚙️ CONFIGURACIÓN
        // ==========================================
        const _esLocalhost = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1');
        const URL_API = _esLocalhost
            ? 'http://localhost:3000'
            : (window.OVJ_CONFIG?.urlTunel || 'http://localhost:3000');

        const INTERVALO_REFRESH_MS = 30000;

        // ==========================================
        // 🔑 ESTADO GLOBAL
        // ==========================================
        let adminToken = null;
        let tabActual = 'dashboard';
        let intervalRefresh = null;
        let cacheFotografos = [];
        let cacheEventos = [];
        let cacheCatalogoPremios = [];
        let ticketsEventoSeleccionado = null;

        // ==========================================
        // 🛠️ UTILIDADES
        // ==========================================
        function $(id) { return document.getElementById(id); }

        function toast(mensaje, tipo = '') {
            const el = $('toast');
            el.textContent = mensaje;
            el.className = 'toast activo ' + tipo;
            setTimeout(() => el.classList.remove('activo'), 3500);
        }

        function loader(activo) {
            $('loader').classList.toggle('activo', activo);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function formatearFecha(fechaStr) {
            if (!fechaStr) return '';
            const [y, m, d] = fechaStr.split('-');
            return `${d}/${m}/${y}`;
        }

        function formatearHora(fechaISO) {
            if (!fechaISO) return '';
            const d = new Date(fechaISO);
            return d.toLocaleTimeString('es-BO', {
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });
        }

        async function apiFetch(ruta, opciones = {}) {
            const headers = opciones.headers || {};
            headers['Content-Type'] = 'application/json';
            if (adminToken) headers['Authorization'] = 'Bearer ' + adminToken;

            const resp = await fetch(URL_API + ruta, { ...opciones, headers });

            if (resp.status === 401) {
                cerrarSesionLocal();
                toast('Token inválido. Volvé a entrar.', 'error');
                throw new Error('No autorizado');
            }

            const data = await resp.json().catch(() => ({}));
            if (!resp.ok) throw new Error(data.error || `Error ${resp.status}`);
            return data;
        }

        // ==========================================
        // 🔐 SESIÓN
        // ==========================================
        function cargarSesionLocal() {
            const t = localStorage.getItem('ovj_admin_token');
            if (!t) return false;
            adminToken = t;
            return true;
        }

        function guardarSesionLocal(t) {
            localStorage.setItem('ovj_admin_token', t);
            adminToken = t;
        }

        function cerrarSesionLocal() {
            localStorage.removeItem('ovj_admin_token');
            adminToken = null;
            if (intervalRefresh) { clearInterval(intervalRefresh); intervalRefresh = null; }
        }

        async function hacerLogin() {
            const token = $('inputToken').value.trim();
            const btn = $('btnLogin');
            const err = $('errorLogin');

            err.classList.remove('activo');

            if (!token) {
                err.textContent = 'Pega el token';
                err.classList.add('activo');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Verificando...';

            try {
                const resp = await fetch(URL_API + '/admin/status', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (!resp.ok) {
                    err.textContent = 'Token inválido';
                    err.classList.add('activo');
                    btn.disabled = false;
                    btn.textContent = 'Entrar';
                    return;
                }

                guardarSesionLocal(token);
                mostrarApp();
                cambiarTab('dashboard');

            } catch (e) {
                err.textContent = 'Error de conexión. Intenta de nuevo.';
                err.classList.add('activo');
                btn.disabled = false;
                btn.textContent = 'Entrar';
            }
        }

        function hacerLogout() {
            if (!confirm('¿Cerrar sesión?')) return;
            cerrarSesionLocal();
            mostrarLogin();
        }

        // ==========================================
        // 🖥️ PANTALLAS
        // ==========================================
        function mostrarLogin() {
            $('pantallaLogin').classList.add('activo');
            $('app').classList.remove('activo');
            $('inputToken').value = '';
            $('errorLogin').classList.remove('activo');
            $('btnLogin').disabled = false;
            $('btnLogin').textContent = 'Entrar';
        }

        function mostrarApp() {
            $('pantallaLogin').classList.remove('activo');
            $('app').classList.add('activo');
        }

        // ==========================================
        // 🗂️ TABS
        // ==========================================
        function cambiarTab(tab) {
            tabActual = tab;

            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.toggle('activo', el.dataset.tab === tab);
            });

            if (intervalRefresh) { clearInterval(intervalRefresh); intervalRefresh = null; }

            switch (tab) {
                case 'dashboard': renderDashboard(); intervalRefresh = setInterval(renderDashboard, INTERVALO_REFRESH_MS); break;
                case 'fotografos': renderFotografos(); break;
                case 'eventos': renderEventos(); break;
                case 'tickets': renderTickets(); break;
                case 'sistema': renderSistema(); break;
            }
        }

        // ==========================================
        // 📊 DASHBOARD
        // ==========================================
        async function renderDashboard() {
            $('contenidoPrincipal').innerHTML = `
                <div class="page-header">
                    <div>
                        <h1>📊 Dashboard</h1>
                        <div class="subtitulo">Estado general del sistema</div>
                    </div>
                    <div class="acciones">
                        <button class="btn btn-secundario" onclick="renderDashboard()">🔄 Refrescar</button>
                    </div>
                </div>
                <div class="vacio"><span class="emoji">⏳</span><div class="titulo">Cargando...</div></div>
            `;

            try {
                const [status, fotografos] = await Promise.all([
                    apiFetch('/admin/status'),
                    apiFetch('/admin/fotografos')
                ]);

                cacheFotografos = fotografos.fotografos || [];

                const totalFotografos = cacheFotografos.length;
                const conEventoActivo = status.fotografos.filter(f => f.eventoActivo).length;
                const totalFotosWeb = status.fotografos.reduce((a, f) => a + (f.fotosWeb || 0), 0);
                const totalPendientes = status.fotografos.reduce((a, f) => a + (f.fotosPendientes || 0), 0);

                let html = `
                    <div class="page-header">
                        <div>
                            <h1>📊 Dashboard</h1>
                            <div class="subtitulo">Estado general · Actualizado ${new Date().toLocaleTimeString('es-BO', { hour: '2-digit', minute: '2-digit', hour12: false })}</div>
                        </div>
                        <div class="acciones">
                            <button class="btn btn-secundario" onclick="renderDashboard()">🔄 Refrescar</button>
                        </div>
                    </div>

                    <div class="grid" style="margin-bottom:20px;">
                        <div class="card card-stat">
                            <span class="emoji">👥</span>
                            <div class="info">
                                <div class="valor">${totalFotografos}</div>
                                <div class="etiqueta">Fotógrafos</div>
                            </div>
                        </div>
                        <div class="card card-stat">
                            <span class="emoji">🟢</span>
                            <div class="info">
                                <div class="valor">${conEventoActivo}</div>
                                <div class="etiqueta">Eventos activos</div>
                            </div>
                        </div>
                        <div class="card card-stat">
                            <span class="emoji">🌐</span>
                            <div class="info">
                                <div class="valor">${totalFotosWeb}</div>
                                <div class="etiqueta">Fotos en web</div>
                            </div>
                        </div>
                        <div class="card card-stat">
                            <span class="emoji">⏳</span>
                            <div class="info">
                                <div class="valor">${totalPendientes}</div>
                                <div class="etiqueta">En cola de goteo</div>
                            </div>
                        </div>
                    </div>
                `;

                if (status.fotografos.length === 0) {
                    html += `<div class="vacio"><span class="emoji">👥</span><div class="titulo">No hay fotógrafos registrados</div><div class="subtitulo">Ve a la pestaña "Fotógrafos" para agregar uno.</div></div>`;
                } else {
                    html += `<div class="grid grid-2">`;
                    status.fotografos.forEach(f => {
                        const activo = f.eventoActivo;
                        const modoEvento = activo ? (activo.modoEvento || 'B') : null;

                        let etiquetaModo = '';
                        if (activo) {
                            if (modoEvento === 'A') etiquetaModo = ' · 🎪 Íntimo';
                            else etiquetaModo = ' · 🎪 Masivo';
                        }

                        html += `
                            <div class="card">
                                <div class="cabecera" style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px;">
                                    <div>
                                        <div style="font-size:1.05rem; font-weight:700; color:#fff;">${escapeHtml(f.nombre)}</div>
                                        ${activo ? `<div style="font-size:0.75rem; color:#f39c12; margin-top:4px;">● ${escapeHtml(activo.evento)}${etiquetaModo}</div>` : `<div style="font-size:0.72rem; color:#666; margin-top:4px;">Sin evento activo</div>`}
                                    </div>
                                    ${activo ? `<span class="badge activo">● Activo</span>` : `<span class="badge finalizado">Inactivo</span>`}
                                </div>
                                <div style="display:flex; gap:14px; font-size:0.75rem; color:#aaa; margin-bottom:6px; flex-wrap:wrap;">
                                    <span>🌐 Web: <strong style="color:#fff;">${f.fotosWeb || 0}</strong></span>
                                    <span>⏳ Cola: <strong style="color:#fff;">${f.fotosPendientes || 0}</strong></span>
                                </div>
                                ${activo ? `<div style="font-size:0.7rem; color:#666;">▶️ ${formatearHora(activo.inicioReal)} · ${activo.duracionTotal}h</div>` : ''}
                            </div>
                        `;
                    });
                    html += `</div>`;
                }

                $('contenidoPrincipal').innerHTML = html;

            } catch (e) {
                $('contenidoPrincipal').innerHTML = `
                    <div class="page-header"><div><h1>📊 Dashboard</h1></div></div>
                    <div class="vacio"><span class="emoji">❌</span><div class="titulo">Error al cargar</div><div class="subtitulo">${escapeHtml(e.message)}</div></div>
                `;
            }
        }

        // ==========================================
        // 👥 FOTÓGRAFOS
        // ==========================================
        async function renderFotografos() {
            $('contenidoPrincipal').innerHTML = `
                <div class="page-header">
                    <div>
                        <h1>👥 Fotógrafos</h1>
                        <div class="subtitulo">Gestión de fotógrafos registrados</div>
                    </div>
                    <div class="acciones">
                        <button class="btn btn-primario" onclick="abrirNuevoFotografo()">➕ Nuevo fotógrafo</button>
                        <button class="btn btn-secundario" onclick="renderFotografos()">🔄 Refrescar</button>
                    </div>
                </div>
                <div class="vacio"><span class="emoji">⏳</span><div class="titulo">Cargando...</div></div>
            `;

            try {
                const data = await apiFetch('/admin/fotografos');
                cacheFotografos = data.fotografos || [];

                if (cacheFotografos.length === 0) {
                    $('contenidoPrincipal').innerHTML = `
                        <div class="page-header">
                            <div><h1>👥 Fotógrafos</h1><div class="subtitulo">Gestión de fotógrafos registrados</div></div>
                            <div class="acciones">
                                <button class="btn btn-primario" onclick="abrirNuevoFotografo()">➕ Nuevo fotógrafo</button>
                            </div>
                        </div>
                        <div class="vacio"><span class="emoji">👥</span><div class="titulo">No hay fotógrafos</div><div class="subtitulo">Agrega el primero con el botón de arriba.</div></div>
                    `;
                    return;
                }

                let html = `
                    <div class="page-header">
                        <div><h1>👥 Fotógrafos</h1><div class="subtitulo">${cacheFotografos.length} registrado${cacheFotografos.length === 1 ? '' : 's'}</div></div>
                        <div class="acciones">
                            <button class="btn btn-primario" onclick="abrirNuevoFotografo()">➕ Nuevo fotógrafo</button>
                            <button class="btn btn-secundario" onclick="renderFotografos()">🔄 Refrescar</button>
                        </div>
                    </div>
                    <div class="grid grid-2">
                `;

                cacheFotografos.forEach(f => {
                    html += `
                        <div class="card card-fotografo">
                            <div class="cabecera">
                                <div>
                                    <div class="nombre">${escapeHtml(f.nombre)}</div>
                                    <div class="chatid">chat_id: ${escapeHtml(f.chatId || '—')}</div>
                                </div>
                            </div>

                            <div class="pin-box">
                                <span class="label">PIN de acceso web</span>
                                <span class="pin">${f.pin || '—'}</span>
                            </div>

                            <div class="stats">
                                <span>🟢 Activos: <strong>${f.activos}</strong></span>
                                <span>📅 Agendados: <strong>${f.agendados}</strong></span>
                            </div>

                            <div class="acciones">
                                <button class="btn btn-chico btn-secundario" onclick="copiarPin('${f.pin}','${escapeHtml(f.nombre)}')">📋 Copiar PIN</button>
                                <button class="btn btn-chico btn-secundario" onclick="verLinkAcceso('${escapeHtml(f.nombre)}')">🔗 Link</button>
                                <button class="btn btn-chico btn-peligro" onclick="confirmarEliminarFotografo('${escapeHtml(f.nombre)}')">🗑️ Eliminar</button>
                            </div>
                        </div>
                    `;
                });

                html += `</div>`;
                $('contenidoPrincipal').innerHTML = html;

            } catch (e) {
                $('contenidoPrincipal').innerHTML = `
                    <div class="page-header"><div><h1>👥 Fotógrafos</h1></div></div>
                    <div class="vacio"><span class="emoji">❌</span><div class="titulo">Error</div><div class="subtitulo">${escapeHtml(e.message)}</div></div>
                `;
            }
        }

        function abrirNuevoFotografo() {
            abrirModal(`
                <button class="btn-cerrar" onclick="cerrarModal()">✕</button>
                <div class="titulo">➕ Nuevo Fotógrafo</div>
                <div class="subtitulo">Se generará un PIN de 4 dígitos automáticamente.</div>

                <div class="campo">
                    <label>Nombre de usuario</label>
                    <input type="text" id="inputNombreFotografo" placeholder="ej: jhumer" autocomplete="off" style="text-transform:lowercase" />
                    <div class="ayuda">3-30 caracteres. Solo minúsculas, números, guion y guion bajo.</div>
                </div>

                <button class="btn-primario" id="btnCrearFotografo" onclick="crearFotografo()">Crear fotógrafo</button>
                <button class="btn-secundario" onclick="cerrarModal()">Cancelar</button>
            `);
        }

        async function crearFotografo() {
            const nombre = $('inputNombreFotografo').value.trim().toLowerCase();
            if (!/^[a-z0-9_-]{3,30}$/.test(nombre)) {
                toast('Nombre inválido (3-30, minúsculas/números/-/_)', 'error');
                return;
            }

            $('btnCrearFotografo').disabled = true;
            $('btnCrearFotografo').textContent = 'Creando...';

            try {
                const data = await apiFetch('/admin/fotografos', {
                    method: 'POST',
                    body: JSON.stringify({ nombre })
                });

                mostrarPinGenerado(data.nombre, data.pin);

            } catch (e) {
                toast('Error: ' + e.message, 'error');
                $('btnCrearFotografo').disabled = false;
                $('btnCrearFotografo').textContent = 'Crear fotógrafo';
            }
        }

        function mostrarPinGenerado(nombre, pin) {
            abrirModal(`
                <button class="btn-cerrar" onclick="cerrarModal(); renderFotografos();">✕</button>
                <div class="titulo">✅ Fotógrafo creado</div>
                <div class="subtitulo">Pasale estos datos al fotógrafo por WhatsApp.</div>

                <div style="background:rgba(243,156,18,0.08); border:1px solid rgba(243,156,18,0.3); border-radius:12px; padding:18px; text-align:center; margin-bottom:18px;">
                    <div style="font-size:0.75rem; color:#aaa; margin-bottom:6px;">Usuario</div>
                    <div style="font-size:1.3rem; font-weight:700; color:#fff; margin-bottom:14px;">${escapeHtml(nombre)}</div>
                    <div style="font-size:0.75rem; color:#aaa; margin-bottom:6px;">PIN</div>
                    <div style="font-size:2rem; font-weight:700; color:#f39c12; letter-spacing:6px;">${escapeHtml(pin)}</div>
                </div>

                <div class="token-box">${URL_API.replace(/\/$/, '')}\n\nIngresar en: https://jhumeroveja.github.io/ovj/fotografo.html</div>

                <button class="btn-primario" onclick="copiarDatosFotografo('${escapeHtml(nombre)}','${escapeHtml(pin)}')">📋 Copiar datos</button>
                <button class="btn-secundario" onclick="cerrarModal(); renderFotografos();">Listo</button>
            `);
        }

        function copiarDatosFotografo(nombre, pin) {
            const texto = `OVJ Studio - Acceso Fotógrafo\n\nUsuario: ${nombre}\nPIN: ${pin}\n\nIngresá en:\nhttps://jhumeroveja.github.io/ovj/fotografo.html`;
            navigator.clipboard.writeText(texto).then(() => {
                toast('✅ Datos copiados', 'ok');
            }).catch(() => {
                toast('No se pudo copiar', 'error');
            });
        }

        function copiarPin(pin, nombre) {
            if (!pin) return;
            navigator.clipboard.writeText(pin).then(() => {
                toast('✅ PIN copiado', 'ok');
            }).catch(() => {
                toast('No se pudo copiar', 'error');
            });
        }

        function verLinkAcceso(nombre) {
            abrirModal(`
                <button class="btn-cerrar" onclick="cerrarModal()">✕</button>
                <div class="titulo">🔗 Link de acceso</div>
                <div class="subtitulo">Comparte este link con el fotógrafo.</div>
                <div class="token-box">https://jhumeroveja.github.io/ovj/fotografo.html</div>
                <button class="btn-secundario" onclick="cerrarModal()">Cerrar</button>
            `);
        }

        function confirmarEliminarFotografo(nombre) {
            abrirModal(`
                <button class="btn-cerrar" onclick="cerrarModal()">✕</button>
                <div class="titulo">🗑️ Eliminar fotógrafo</div>
                <div class="subtitulo">
                    ¿Eliminar a <strong>${escapeHtml(nombre)}</strong>?<br>
                    Se borrarán sus fotos locales y su carpeta.
                </div>
                <button class="btn-peligro" onclick="eliminarFotografo('${escapeHtml(nombre)}')">Sí, eliminar</button>
                <button class="btn-secundario" onclick="cerrarModal()">Cancelar</button>
            `);
        }

        async function renderEventos() {
            $('contenidoPrincipal').innerHTML = `
                <div class="page-header">

            `;

            try {
                const [eventos, fotografos] = await Promise.all([
                    apiFetch('/admin/eventos'),
                    apiFetch('/admin/fotografos')
                ]);

                cacheEventos = eventos.eventos || [];
                cacheFotografos = fotografos.fotografos || [];

                const activos = cacheEventos.filter(e => e.estado === 'activo');
                const agendados = cacheEventos.filter(e => e.estado === 'agendado');
                const otros = cacheEventos.filter(e => e.estado !== 'activo' && e.estado !== 'agendado');

                let html = `
                    <div class="page-header">
                        <div><h1>📅 Eventos</h1><div class="subtitulo">${cacheEventos.length} en total</div></div>
                        <div class="acciones">
                            <button class="btn btn-primario" onclick="abrirNuevoEvento()">➕ Agendar evento</button>
                            <button class="btn btn-secundario" onclick="renderEventos()">🔄 Refrescar</button>
                        </div>
                    </div>
                `;

                if (cacheEventos.length === 0) {
                    html += `<div class="vacio"><span class="emoji">📅</span><div class="titulo">No hay eventos</div><div class="subtitulo">Agrega el primero con el botón de arriba.</div></div>`;
                } else {
                    if (activos.length > 0) {
                        html += `<div class="seccion-titulo-form" style="margin-top:0;padding-top:0;border-top:none;">🟢 Activos (${activos.length})</div>`;
                        html += `<div class="grid grid-2" style="margin-bottom:24px;">`;
                        activos.forEach(e => html += renderCardEvento(e, true));
                        html += `</div>`;
                    }

                    if (agendados.length > 0) {
                        html += `<div class="seccion-titulo-form" style="margin-top:0;padding-top:0;border-top:none;">⏳ Agendados (${agendados.length})</div>`;
                        html += `<div class="grid grid-2" style="margin-bottom:24px;">`;
                        agendados.forEach(e => html += renderCardEvento(e, false));
                        html += `</div>`;
                    }

                    if (otros.length > 0) {
                        html += `<div class="seccion-titulo-form" style="margin-top:0;padding-top:0;border-top:none;">📋 Historial (${otros.length})</div>`;
                        html += `<div class="grid grid-2">`;
                        otros.slice(0, 12).forEach(e => html += renderCardEvento(e, false));
                        html += `</div>`;
                    }

                $('contenidoPrincipal').innerHTML = html;

            } catch (e) {
                $('contenidoPrincipal').innerHTML = `
                    <div class="page-header"><div><h1>📅 Eventos</h1></div></div>
                    <div class="vacio"><span class="emoji">❌</span><div class="titulo">Error</div><div class="subtitulo">${escapeHtml(e.message)}</div></div>

        function renderCardEvento(e, esActivo) {
            const badgeClase = e.estado === 'activo' ? 'activo' : e.estado === 'agendado' ? 'agendado' : e.estado === 'cancelado' ? 'cancelado' : 'finalizado';
            const badgeTexto = e.estado === 'activo' ? '● Activo' : e.estado === 'agendado' ? '⏳ Agendado' : e.estado === 'cancelado' ? '✗ Cancelado' : '✔ Finalizado';

            const modoEvento = e.modoEvento || 'B';

            let meta = '';
            meta += `<div class="fila">🗓️ <strong>${formatearFecha(e.fechaProgramada)}</strong></div>`;
            meta += `<div class="fila">⏰ <strong>${e.horaInicio}</strong> · ${e.duracionTotalProgramada || e.duracionProgramada}h</div>`;

            // 🔥 FASE 2: mostrar modo y VIPs
            if (modoEvento === 'A') {
                meta += `<div class="fila" style="color:#e8c47a;">🎪 Modo: <strong>Íntimo</strong> (todos VIP)</div>`;
            } else {
                meta += `<div class="fila" style="color:#5dade2;">🎪 Modo: <strong>Masivo</strong> · VIPs: ${e.maxVips || 0}</div>`;
            }

            if (e.whatsappCliente) meta += `<div class="fila">📱 +${e.whatsappCliente}</div>`;

            // Pool general
            if (e.poolGeneral && modoEvento === 'B') {
                meta += `<div class="fila" style="color:#5dade2;">📥 ${e.poolGeneral.descargasPorSesion} desc/sesión · ${e.poolGeneral.maxGeneralesSimultaneos || 20} simultáneos</div>`;

                // 🔥 Desbloqueo social
                if (e.poolGeneral.desbloqueoSocialActivo) {
                    meta += `<div class="fila" style="color:#e8c47a;">🎁 Desbloqueo social: +${e.poolGeneral.desbloqueoSocialDescargas || 3} descargas</div>`;
                } else {
                    meta += `<div class="fila" style="color:#666;">🎁 Desbloqueo social: desactivado</div>`;
                }
            }

            // Razón de cierre
            if (e.estado === 'cancelado') {
                const cuando = e.canceladoEn ? ` · ${formatearHora(e.canceladoEn)}` : '';
                meta += `<div class="fila" style="color:#e74c3c;">✗ Cancelado por admin${cuando}</div>`;
            } else if (e.estado === 'finalizado') {
                const quien = e.finalizadoPor === 'admin_web' ? 'admin'
                    : e.finalizadoPor === 'fotografo_web' ? 'fotógrafo'
                        : 'sistema';
                const cuando = e.finReal ? ` · ${formatearHora(e.finReal)}` : '';
                meta += `<div class="fila" style="color:#888;">✔ Finalizado por ${quien}${cuando}</div>`;
            }

            let acciones = '';
            if (e.estado === 'agendado') {
                acciones = `
                    <button class="btn btn-chico btn-secundario" onclick="verTokenGeneral('${escapeHtml(e.id)}', '${escapeHtml(e.evento)}', '${escapeHtml(e.fotografo)}', '${escapeHtml(modoEvento)}')">🎫 Ver QR</button>
                    <button class="btn btn-chico btn-peligro" onclick="confirmarCancelarEvento('${escapeHtml(e.id)}','${escapeHtml(e.evento)}')">🗑️ Cancelar</button>
                `;
            } else if (e.estado === 'activo') {
                acciones = `
                    <button class="btn btn-chico btn-secundario" onclick="verTokenGeneral('${escapeHtml(e.id)}', '${escapeHtml(e.evento)}', '${escapeHtml(e.fotografo)}', '${escapeHtml(modoEvento)}')">🎫 Ver QR</button>
                `;
            }

            return `
                <div class="card card-evento">
                    <div class="cabecera">
                        <div>
                            <div class="titulo">${escapeHtml(e.evento)}</div>
                            <div class="fotografo">👤 ${escapeHtml(e.fotografo)}</div>
                        </div>
                        <span class="badge ${badgeClase}">${badgeTexto}</span>
                    </div>
                    <div class="meta">${meta}</div>
                    ${acciones ? `<div class="acciones">${acciones}</div>` : ''}
                </div>
            `;
        }

        // 🎁 FORM DE COFRES
        // ==========================================
        function inicializarFormCofres() {
            const select = $('inputCofresActivo');
            const bloque = $('bloqueCofresConfig');
            const lista = $('listaPremiosCofres');

            if (!select || !bloque || !lista) return;

            // Renderizar el catálogo
            if (cacheCatalogoPremios.length === 0) {
                lista.innerHTML = '<div style="color:#888; font-size:0.75rem; padding:10px;">No hay premios disponibles.</div>';
            } else {
                let html = '';
                cacheCatalogoPremios.forEach(p => {
                    const esJackpot = p.tipo === 'jackpot';
                    const color = esJackpot ? '#e8c47a' : '#aaa';
                    html += `
                <label style="display:flex; align-items:center; gap:6px; padding:6px 8px; border-radius:8px; cursor:pointer; font-size:0.72rem; color:${color}; background:rgba(255,255,255,0.02); transition:background 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.05)'" onmouseout="this.style.background='rgba(255,255,255,0.02)'">
                    <input type="checkbox" class="checkPremio" value="${p.key}" checked style="accent-color:#f39c12;" />
                    <span>${escapeHtml(p.titulo)}</span>
                </label>
            `;
                });
                lista.innerHTML = html;
            }

            // Mostrar/ocultar config al cambiar el select
            function actualizarVisibilidad() {
                if (select.value === 'true') {
                    bloque.style.display = 'block';
                } else {
                    bloque.style.display = 'none';
                }
            }

            select.addEventListener('change', actualizarVisibilidad);
            actualizarVisibilidad();

        function getCofresDelForm() {
            const select = $('inputCofresActivo');
            if (!select || select.value !== 'true') {
                return {
                    activo: false,
                    cantidadTickets: 0,
                    horaEntrega: null,
                    premios: []
                };
            }

            const cantidadTickets = parseInt($('inputCofresCantidad')?.value, 10) || 0;
            const horaEntrega = $('inputCofresHora')?.value || null;

            const premios = [];
            document.querySelectorAll('.checkPremio:checked').forEach(chk => {
                premios.push(chk.value);
            });

            return {
                activo: true,
                cantidadTickets,
                horaEntrega,
                premios
            };
        }

        async function crearEvento() {
            const fotografo = $('inputFotografo').value;
            const evento = $('inputEventoNombre').value.trim();
            const fecha = $('inputEventoFecha').value;
            const hora = $('inputEventoHora').value;
            const duracion = parseInt($('inputEventoDuracion').value, 10);
            const whatsapp = $('inputEventoWhatsapp').value.replace(/[^0-9]/g, '');

            // 🔥 FASE 2: modo del evento
            const modoEvento = $('inputModoEvento')?.value || 'B';

            const poolGeneral = {
                descargasPorSesion: parseInt($('inputDescargasPorSesion')?.value, 10) || 5,
                duracionSesionMin: parseInt($('inputDuracionSesion')?.value, 10) || 60,
                descansoMin: parseInt($('inputDescanso')?.value, 10) || 60,
                maxGeneralesSimultaneos: parseInt($('inputMaxGenerales')?.value, 10) || 20,
                desbloqueoSocialActivo: modoEvento === 'B'
                    ? $('inputDesbloqueoSocialActivo')?.value === 'true'
                    : false,
                desbloqueoSocialDescargas: parseInt($('inputDesbloqueoSocialDescargas')?.value, 10) || 3,
                pedirNombreAlEntrar: modoEvento === 'B'
                    ? $('inputPedirNombre')?.value === 'true'
                    : false
            };

            const maxVips = modoEvento === 'B'
                ? (parseInt($('inputMaxVips')?.value, 10) || 5)
                : 0;

            // 🔥 COFRES
            const cofres = getCofresDelForm();

            if (cofres.activo && cofres.premios.length === 0) {
                toast('Seleccioná al menos un premio para los cofres', 'error');
                return;
            }

            if (cofres.activo && !cofres.horaEntrega) {
                toast('Configurá la hora de entrega de los cofres', 'error');
                return;
            }

            if (cofres.activo && cofres.cantidadTickets <= 0) {
                toast('La cantidad de tickets debe ser mayor a 0', 'error');
                return;
            }

            if (!evento || evento.length < 2) { toast('Nombre de evento inválido', 'error'); return; }
            if (!fecha || !hora) { toast('Fecha y hora obligatorias', 'error'); return; }
            if (!duracion || duracion < 1 || duracion > 24) { toast('Duración inválida', 'error'); return; }

            $('btnCrearEvento').disabled = true;
            $('btnCrearEvento').textContent = 'Agendando...';

            try {
                const data = await apiFetch('/admin/eventos', {
                    method: 'POST',
                    body: JSON.stringify({
                        fotografo,
                        evento,
                        fecha,
                        hora,
                        duracion,
                        whatsappCliente: whatsapp || null,
                        modoEvento,
                        maxVips,
                        poolGeneral,
                        cofres
                    })
                });

                cerrarModal();

                if (data.tokenGeneral) {
                    setTimeout(() => mostrarTokenGeneral(
                        data.evento.evento,
                        data.tokenGeneral,
                        fotografo,
                        data.evento.id,
                        data.evento.modoEvento || 'B'
                    ), 300);
                } else {
                    toast('✅ Evento agendado', 'ok');
                    renderEventos();
                }

            } catch (e) {
                toast('Error: ' + e.message, 'error');
                $('btnCrearEvento').disabled = false;
                $('btnCrearEvento').textContent = 'Agendar evento';
            }
        }

        // ==========================================
        // 💡 SUGERENCIA AUTOMÁTICA
        // ==========================================
        function getSugerencia(duracion) {
            if (duracion <= 3) {
                return {
                    descargasPorSesion: 3,
                    duracionSesionMin: 45,
                    descansoMin: 45,
                    texto: '3 descargas/sesión · 45 min sesión · 45 min descanso'
                };
            } else if (duracion <= 5) {
                return {
                    descargasPorSesion: 5,
                    duracionSesionMin: 60,
                    descansoMin: 60,
                    texto: '5 descargas/sesión · 60 min sesión · 60 min descanso'
                };
            } else if (duracion <= 8) {
                return {

        // ==========================================
        // 🎫 TOKEN GENERAL: MODAL CON QR
        // ==========================================
        function mostrarTokenGeneral(nombreEvento, token, fotografo, eventoId, modoEvento = 'B') {
            const urlGeneral = `https://jhumeroveja.github.io/ovj/?f=${encodeURIComponent(fotografo)}&e=${encodeURIComponent(eventoId)}&t=${encodeURIComponent(token)}`;

            const bloqueModo = modoEvento === 'A' ? `
                <div style="background:rgba(232,196,122,0.08); border:1px solid rgba(232,196,122,0.3); border-radius:12px; padding:12px 14px; margin-bottom:16px; font-size:0.78rem; color:#e8c47a; line-height:1.5; text-align:center;">
                    🎪 <strong>Modo Íntimo</strong><br>
                    Todos los que escaneen este QR serán VIP automáticamente.
                </div>
            ` : `
                <div style="background:rgba(96,165,250,0.08); border:1px solid rgba(96,165,250,0.3); border-radius:12px; padding:12px 14px; margin-bottom:16px; font-size:0.78rem; color:#93c5fd; line-height:1.5; text-align:center;">
                    🎪 <strong>Modo Masivo</strong><br>
                    Este es el QR general (invitados comunes).<br>
                    El cliente generará los QRs VIP desde su link.
                </div>
            `;

            abrirModal(`
                <button class="btn-cerrar" onclick="cerrarModal(); renderEventos();">✕</button>
                <div class="titulo">🎫 Token General</div>
                <div class="subtitulo">
                    <strong>${escapeHtml(nombreEvento)}</strong><br><br>
                    Este es el QR que tus invitados generales van a escanear.<br>
                    Imprimilo y pegalo en el evento.
                </div>

                ${bloqueModo}

                <div class="qr-token-wrapper" id="qrTokenWrapper"></div>

                <div class="token-box" id="tokenBox"></div>

                <button class="btn-primario" onclick="copiarUrlGeneral('${escapeHtml(urlGeneral)}')">
                    📋 Copiar URL del QR
                </button>
                <button class="btn-secundario" onclick="descargarQR('${escapeHtml(urlGeneral)}')">
                    💾 Abrir QR en pestaña nueva
                </button>
                <button class="btn-secundario" onclick="cerrarModal(); renderEventos();">
                    Listo
                </button>
            `);

            try {
                const qr = window.qrcode(0, 'M');
                qr.addData(urlGeneral);
                qr.make();

                const wrapper = $('qrTokenWrapper');
                wrapper.innerHTML = qr.createImgTag(6, 12);
                const img = wrapper.querySelector('img');
                if (img) {
                    img.style.width = '240px';
                    img.style.height = '240px';
                    img.style.borderRadius = '4px';
                    img.alt = 'QR Token General';
                }
            } catch (error) {
                console.error('Error generando QR local:', error);
                $('qrTokenWrapper').innerHTML = '<div style="color:#333;font-size:0.75rem;text-align:center;padding:20px;">QR no disponible.<br>Usa el botón copiar.</div>';
            }

            $('tokenBox').innerHTML = `<strong style="color:#f39c12;">Token general:</strong><br>${escapeHtml(token)}`;
        }

        function copiarUrlGeneral(url) {
            navigator.clipboard.writeText(url).then(() => {
                toast('✅ URL copiada', 'ok');
            }).catch(() => {
                toast('No se pudo copiar', 'error');
            });
        }

        function descargarQR(url) {
            try {
                const qr = window.qrcode(0, 'M');
                qr.addData(url);
                qr.make();

                const imgTag = qr.createImgTag(10, 20);

                const w = window.open('', '_blank');
                w.document.write(`<html><head><title>QR</title></head><body style="background:#fff;margin:0;display:flex;align-items:center;justify-content:center;height:100vh;">${imgTag}</body></html>`);
                w.document.close();

                const img = w.document.querySelector('img');
                if (img) {
                    img.style.width = '500px';
                    img.style.height = '500px';
                }
            } catch (error) {
                console.error('Error generando QR grande:', error);
                alert('No se pudo generar el QR.');
            }
        }

        // ==========================================
        // 🔍 VER TOKEN DE UN EVENTO EXISTENTE
        // ==========================================
        async function verTokenGeneral(idEvento, nombreEvento, fotografo, modoEvento) {
            loader(true);
            try {
                const data = await apiFetch('/admin/token-general?f=' + encodeURIComponent(fotografo) + '&e=' + encodeURIComponent(idEvento));
                if (data.ok && data.tokenGeneral) {
                    mostrarTokenGeneral(nombreEvento, data.tokenGeneral, fotografo, idEvento, modoEvento || 'B');
                } else {
                    toast('Token no encontrado', 'error');
                }
            } catch (e) {
                if (e.message.includes('no tiene token general') || e.message.includes('404')) {
                    toast('Este evento no tiene token general (es anterior al cambio)', 'error');
                } else {
                    toast('Error: ' + e.message, 'error');
                }
            } finally {
                loader(false);
            }
        }

        // ==========================================
        // 🎁 TICKETS
        // ==========================================
        async function renderTickets() {
            $('contenidoPrincipal').innerHTML = `
        <div class="page-header">
            <div><h1>🎁 Tickets</h1><div class="subtitulo">Cofres-regalo emitidos por evento</div></div>
            <div class="acciones"><button class="btn btn-secundario" onclick="renderTickets()">🔄 Refrescar</button></div>
        </div>
        <div class="vacio"><span class="emoji">⏳</span><div class="titulo">Cargando eventos...</div></div>
    `;

            try {
                const data = await apiFetch('/admin/eventos');
                const eventos = data.eventos || [];

                // Filtrar eventos que tengan cofres configurados
                const conCofres = eventos.filter(e => e.cofres && e.cofres.activo === true);

                if (conCofres.length === 0) {
                    $('contenidoPrincipal').innerHTML = `
                <div class="page-header">
                    <div><h1>🎁 Tickets</h1><div class="subtitulo">Cofres-regalo emitidos por evento</div></div>
                    <div class="acciones"><button class="btn btn-secundario" onclick="renderTickets()">🔄 Refrescar</button></div>
                </div>
                <div class="vacio">
                    <span class="emoji">🎁</span>
                    <div class="titulo">No hay eventos con cofres activados</div>
                    <div class="subtitulo">Al agendar un evento, activá los cofres para que los invitados puedan recibir tickets.</div>
                </div>
            `;
                    return;
                }

                // Ordenar: activos primero, después por fecha descendente
                conCofres.sort((a, b) => {
                    const prioridad = (e) => e.estado === 'activo' ? 0 : (e.estado === 'agendado' ? 1 : 2);
                    const pa = prioridad(a);
                    const pb = prioridad(b);
                    if (pa !== pb) return pa - pb;
                    return new Date(b.fechaProgramada) - new Date(a.fechaProgramada);
                });

                let html = `
            <div class="page-header">
                <div><h1>🎁 Tickets</h1><div class="subtitulo">${conCofres.length} evento${conCofres.length === 1 ? '' : 's'} con cofres</div></div>
                <div class="acciones"><button class="btn btn-secundario" onclick="renderTickets()">🔄 Refrescar</button></div>
            </div>
            <div class="grid grid-2">
        `;

                conCofres.forEach(e => {
                    html += renderCardEventoConCofres(e);
                });

                html += `</div>`;
                $('contenidoPrincipal').innerHTML = html;

            } catch (e) {
                $('contenidoPrincipal').innerHTML = `
            <div class="page-header"><div><h1>🎁 Tickets</h1></div></div>
            <div class="vacio"><span class="emoji">❌</span><div class="titulo">Error</div><div class="subtitulo">${escapeHtml(e.message)}</div></div>
        `;
            }
        }

        function renderCardEventoConCofres(e) {
            const badgeClase = e.estado === 'activo' ? 'activo' : e.estado === 'agendado' ? 'agendado' : 'finalizado';
            const badgeTexto = e.estado === 'activo' ? '● Activo' : e.estado === 'agendado' ? '⏳ Agendado' : '✔ Finalizado';

            const cofres = e.cofres || {};
            const cantidadTickets = cofres.cantidadTickets || 0;
            const horaEntrega = cofres.horaEntrega || '—';
            const emitidosEn = cofres.emitidosEn;
            const premios = Array.isArray(cofres.premios) ? cofres.premios : [];

            let estadoEmision = '';
            if (emitidosEn) {
                estadoEmision = `<div class="fila" style="color:#4ade80;">✅ Emitidos: ${formatearHora(emitidosEn)}</div>`;
            } else if (e.estado === 'activo') {
                estadoEmision = `<div class="fila" style="color:#f39c12;">⏳ Pendiente: se emitirán a las ${horaEntrega}</div>`;
            } else if (e.estado === 'agendado') {
                estadoEmision = `<div class="fila" style="color:#5dade2;">📅 Se emitirán a las ${horaEntrega}</div>`;
            } else {
                estadoEmision = `<div class="fila" style="color:#888;">— No emitidos</div>`;
            }

            // 🔥 CORREGIDO: primero se calcula el map de etiquetas, después se usa
            const mapaEtiquetas = {
                descuento_10: '10% off',
                descuento_15: '15% off',
                descuento_25: '25% off',
                media_hora_extra: '+30 min',
                hora_extra_1: '+1h',
                hora_extra_2: '+2h',
                sesion_familiar: 'Sesión familiar',
                album_digital: 'Álbum digital',
                album_impreso: 'Álbum impreso',
                jackpot_50: '🎰 50% off',
                jackpot_combo: '🎰 Combo'
            };

            const etiquetasPremiosHtml = premios.map(p => {
                const etiqueta = mapaEtiquetas[p] || p;
                const esJackpot = p.startsWith('jackpot');
                return `<span style="display:inline-block; background:${esJackpot ? 'rgba(232,196,122,0.15)' : 'rgba(255,255,255,0.05)'}; border:1px solid ${esJackpot ? 'rgba(232,196,122,0.4)' : 'rgba(255,255,255,0.1)'}; color:${esJackpot ? '#e8c47a' : '#aaa'}; font-size:0.62rem; padding:3px 8px; border-radius:50px; margin:2px 4px 2px 0;">${etiqueta}</span>`;
            }).join('');

            return `
        <div class="card card-evento">
            <div class="cabecera">
                <div>
                    <div class="titulo">${escapeHtml(e.evento)}</div>
                    <div class="fotografo">👤 ${escapeHtml(e.fotografo)}</div>
                </div>
                <span class="badge ${badgeClase}">${badgeTexto}</span>
            </div>
            <div class="meta">
                <div class="fila">🎁 <strong>${cantidadTickets}</strong> ticket${cantidadTickets === 1 ? '' : 's'} reales</div>
                <div class="fila">🕐 Hora de entrega: <strong>${horaEntrega}</strong></div>
                ${estadoEmision}
            </div>
            ${premios.length > 0 ? `
                <div style="margin-top:8px;">
                    <div style="font-size:0.62rem; color:#666; text-transform:uppercase; letter-spacing:1px; margin-bottom:4px;">Premios disponibles</div>
                    <div>${etiquetasPremiosHtml}</div>
                </div>
            ` : ''}
            <div class="acciones">
                <button class="btn btn-chico btn-secundario" onclick="verTicketsEvento('${escapeHtml(e.fotografo)}', '${escapeHtml(e.id)}', '${escapeHtml(e.evento)}')">
                    🎁 Ver tickets
                </button>
            </div>
        </div>
    `;
        }

        // ==========================================
        // 🎁 MODAL DE LISTA DE TICKETS
        // ==========================================
        async function verTicketsEvento(fotografo, eventoId, nombreEvento) {
            ticketsEventoSeleccionado = { fotografo, eventoId, nombreEvento };

            abrirModal(`
        <button class="btn-cerrar" onclick="cerrarModal()">✕</button>
        <div class="titulo">🎁 Tickets: ${escapeHtml(nombreEvento)}</div>
        <div class="subtitulo">Cargando...</div>
        <div id="listaTicketsContainer">
            <div class="vacio"><span class="emoji">⏳</span><div class="titulo">Cargando...</div></div>
        </div>
